<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>浜田山町会 LINE会員</title>
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#1b2438; --sub:#667085; --line:#e4ddcf;
  --navy:#1f3a5f; --navy2:#2f4b7c; --navy3:#12243f; --gold:#b8934a; --red:#c4472f;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fcefd3; --bad:#b3261e; --bad-bg:#fbe5e2; --mute-bg:#ece8de;
  --r:16px; --sh:0 1px 2px rgba(27,36,56,.06),0 6px 20px rgba(27,36,56,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
#app{max-width:520px;margin:0 auto;min-height:100vh}
.pad{padding:16px}
h1,h2,h3{margin:0;line-height:1.35}
.muted{color:var(--sub);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 上部バー */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;background:rgba(243,239,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{width:48px;height:48px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.top .back:active{background:var(--mute-bg)}
.top h1{font-size:18px;font-weight:700;flex:1}
.top .pad-r{width:12px}

/* ヒーロー */
.hero{margin:0;padding:28px 20px 56px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(184,147,74,.35),transparent 55%),linear-gradient(160deg,var(--navy3),var(--navy) 60%,var(--navy2))}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;
  background:repeating-radial-gradient(circle at 0 100%,transparent 0 14px,#fff 14px 15px)}
.hero .brand{position:relative;font-size:13px;letter-spacing:.28em;opacity:.8}
.hero h1{position:relative;font-size:24px;margin-top:6px;font-weight:700}
.hero .sub{position:relative;opacity:.85;margin-top:2px;font-size:15px}
.chip{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.chip.role{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.mute{background:var(--mute-bg);color:var(--sub)}
.sheet{margin:-36px 12px 0;position:relative}
.sheet.flat{margin-top:0}
.hero.short{padding-bottom:28px}

/* カード・ボタン */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border:0;border-radius:14px;
  background:var(--navy);color:#fff;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.55}
.btns{display:grid;gap:10px;margin-top:16px}

/* メニュー */
.sec{margin:22px 4px 8px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--sub);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:98px;padding:12px 4px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;text-align:center;font-weight:700;font-size:13px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.tile svg{width:32px;height:32px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile:active{transform:scale(.97)}
.tile.soon{background:#f7f4ec;box-shadow:none}
.tile.soon svg{stroke:#a3a9b5} .tile.soon{color:#7d8696}
.tile .tag{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;color:var(--sub);background:var(--mute-bg);padding:0 6px;border-radius:999px;line-height:1.7}
.tile.officer svg{stroke:var(--red)}

/* フォーム */
.field{margin-bottom:18px}
.field label.l{display:block;font-weight:700;margin-bottom:2px}
.field .req{color:var(--red);font-size:12px;margin-left:6px;font-weight:700}
.field .hint{font-size:13.5px;color:var(--sub);margin:0 0 6px;line-height:1.5}
.inp{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(47,75,124,.15)}
textarea.inp{min-height:96px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600}
.opt input{width:22px;height:22px;accent-color:var(--navy)}
.opt:has(input:checked){border-color:var(--navy2);background:#eef2f9}
.err{color:var(--bad);font-size:14px;margin-top:6px;font-weight:600}
.notice-box{border-left:4px solid var(--gold);background:#fbf6e9;padding:12px 14px;border-radius:0 12px 12px 0;font-size:14.5px;margin-bottom:16px}

/* 状況画面 */
.center{text-align:center;padding:36px 8px 8px}
.bigicon{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--mute-bg)}
.bigicon svg{width:38px;height:38px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bigicon.bad{background:var(--bad-bg)} .bigicon.bad svg{stroke:var(--bad)}
.bigicon.warn{background:var(--warn-bg)} .bigicon.warn svg{stroke:var(--warn)}
.kv{display:grid;grid-template-columns:7.2em 1fr;gap:6px 10px;font-size:15px;margin:0}
.kv dt{color:var(--sub)} .kv dd{margin:0;word-break:break-all}

/* 会員証 */
.mcard{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:22px 20px 20px;box-shadow:0 14px 30px rgba(18,36,63,.35);
  background:radial-gradient(120% 80% at 100% 0%,rgba(184,147,74,.45),transparent 55%),linear-gradient(155deg,var(--navy3),var(--navy) 60%,var(--navy2))}
.mcard::before{content:"";position:absolute;inset:0;opacity:.07;background:repeating-radial-gradient(circle at 0 100%,transparent 0 14px,#fff 14px 15px)}
.mcard>*{position:relative}
.mcard .t1{font-size:12px;letter-spacing:.3em;opacity:.8}
.mcard .t2{font-size:20px;font-weight:700;margin-bottom:14px}
.mcard .nm{font-size:26px;font-weight:700;line-height:1.3;word-break:break-all}
.mcard .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px;font-size:14px;opacity:.95}
.mcard .no{font-size:20px;font-weight:700;letter-spacing:.04em}
.qrbox{background:#fff;border-radius:16px;padding:10px;margin:18px auto 8px;width:min(66vw,260px);aspect-ratio:1}
.qrbox svg{display:block;width:100%;height:100%}
.mcard .code{text-align:center;font-size:20px;letter-spacing:.24em;font-weight:700;font-variant-numeric:tabular-nums}
.mcard .gold{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 0}

/* ダッシュボード */
.feebig{display:flex;align-items:center;gap:14px}
.feebig .dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.feebig .dot svg{width:30px;height:30px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.feebig.ok .dot{background:var(--ok-bg)} .feebig.ok .dot svg{stroke:var(--ok)}
.feebig.warn .dot{background:var(--warn-bg)} .feebig.warn .dot svg{stroke:var(--warn)}
.feebig.mute .dot{background:var(--mute-bg)} .feebig.mute .dot svg{stroke:var(--sub)}
.feebig .big{font-size:22px;font-weight:700;line-height:1.2}
.years{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ntc{border-top:1px solid var(--line);padding:12px 0}
.ntc:first-child{border-top:0;padding-top:0}
.ntc button{all:unset;display:block;width:100%;cursor:pointer}
.ntc .d{font-size:12.5px;color:var(--sub)}
.ntc .ti{font-weight:700}
.ntc .bd{display:none;margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.ntc.open .bd{display:block}

/* 天気・防災 */
.banner{border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.banner.ok{background:var(--ok-bg);color:#14583a} .banner.advisory{background:var(--warn-bg);color:#6e4100}
.banner.warning{background:#fbe0dc;color:#8d1d16} .banner.special{background:#5a1d6b;color:#fff}
.banner b{font-size:17px}
.wlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.wlist li{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:var(--ink);font-weight:600}
.links a::after{content:"›";font-size:22px;color:var(--sub)}
.today{display:flex;align-items:center;gap:16px}
.today svg.wi{width:84px;height:84px;flex:none}
.today .tx{font-size:20px;font-weight:700;line-height:1.35}
.tm{display:flex;gap:18px;margin-top:10px;font-weight:700}
.tm .lo{color:#2563a8} .tm .hi{color:var(--red)}
.pops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pops div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:13px}
.pops b{display:block;font-size:18px}
.wk{display:grid;grid-template-columns:5.6em 34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wk:first-of-type{border-top:0}
.wk svg{width:30px;height:30px}
.wk .tt{text-align:right;font-weight:700;white-space:nowrap}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,#ebe6da,#f5f1e8,#ebe6da);background-size:200% 100%;animation:sk 1.4s infinite linear;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:88vw;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:20;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 下のタブ(どの画面からでも、閉じずに移動できる) */
.bnav{overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:6;width:min(100%,520px);display:flex;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.bnav button{all:unset;position:relative;flex:0 0 auto;width:calc(100% / 5.5);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;border-radius:12px}
.bnav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current=page]{color:var(--navy);background:#eef2f9}
.bnav::-webkit-scrollbar{display:none}
.bnav button{scroll-snap-align:start}
.bnav button.off{color:var(--red)}
.bnav button.soon svg,.bnav button.soon span{opacity:.5}
.bnav button span{white-space:nowrap}
.bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#d92d20;color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700;border:2px solid #fffdf8;line-height:14px}
.tile .bdg{top:8px;left:8px}
.bnav button:active{background:var(--mute-bg)}
body.hasnav #app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
/* 役員画面 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--navy);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{all:unset;text-align:center;padding:10px 4px;font-weight:700;color:var(--navy);cursor:pointer;min-height:24px;box-sizing:border-box;font-size:14px}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{all:unset;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.gh .hd{font-weight:700;font-size:17px}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.mrow.first{border-top:0}
.mrow .nm{font-weight:700}
.mrow .ad{font-size:14px;color:var(--sub)}
.mrow.done .nm{opacity:.55}
.mrow .acts{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{all:unset;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;font-size:14.5px;cursor:pointer;box-sizing:border-box}
.sbtn.fill{background:var(--navy);color:#fff}
.sbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sbtn[disabled]{opacity:.5}
.bar{height:10px;background:#e3e8ef;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.dot2{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-4px;margin-right:4px}
.dot2.on{background:var(--red)} .dot2.off{border:2px solid var(--line)}
.stable{width:100%;border-collapse:collapse;font-size:14.5px}.stable th,.stable td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}.stable th:first-child,.stable td:first-child{text-align:left}.stable th{font-size:12.5px;color:var(--sub);border-top:0}
.scanres{border-left:5px solid var(--navy)}
.scanres.good{border-left-color:var(--ok)} .scanres.warn{border-left-color:var(--warn)}
.inrow{display:flex;gap:8px}.inrow input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;letter-spacing:.1em;text-transform:uppercase;background:#fff}
/* メールBOX */
.ml{all:unset;display:block;box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 14px 12px 30px;margin-bottom:10px;position:relative;cursor:pointer}
.ml:active{transform:scale(.99)}
.ml .dt{position:absolute;left:11px;top:19px;width:11px;height:11px;border-radius:50%;background:#d92d20}
.ml .sj{font-size:16.5px;line-height:1.4}
.ml.un .sj{font-weight:700}
.ml .mt{font-size:13px;color:var(--sub);margin-top:2px}
.tg{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin:6px 6px 0 0;background:var(--mute-bg);color:var(--sub)}
.tg.imp{background:#fde4e1;color:#b3261e} .tg.warn{background:var(--warn-bg);color:var(--warn)} .tg.ok{background:var(--ok-bg);color:var(--ok)}
.mbody{white-space:pre-wrap;word-break:break-word;line-height:1.7;margin:10px 0 0}
.small{font-size:12px;color:var(--sub);line-height:1.6}
.rp{padding:10px 12px;border-radius:12px;background:#eef2f9;margin:8px 0;max-width:92%}
.rp.me{background:#e3f3ea;margin-left:auto}
.rp .who{font-size:12px;color:var(--sub);margin-bottom:2px}
.rp .tx{white-space:pre-wrap;word-break:break-word}
.plist{max-height:240px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:4px 10px}
.plist label{display:flex;gap:10px;align-items:center;min-height:44px}
.plist input{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="pad"><div class="skel"></div><div class="skel"></div></div></div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="qr.js"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
'use strict';
var CFG = window.APP_CONFIG || {};
var S = { me: null, tab: '' };
var $ = function (s, el) { return (el || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; }); }
var toastT;
function toast(m) { var t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, 2600); }

/* ---------- アイコン ---------- */
var IC = {
  card: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.6-1.5 4.4-1.5 5 0M14 10h4M14 13h3"/>',
  dashboard: '<path d="M5 20V11M11 20V4M17 20v-6M3 20h18"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  event: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  help: '<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',
  suginami: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M12 8v5M12 16v.5"/>',
  weather: '<circle cx="8" cy="8" r="3"/><path d="M8 2v1M2 8h1M3.8 3.8l.7.7M12.2 3.8l-.7.7"/><path d="M8 19h9a4 4 0 000-8 5 5 0 00-9.6 1.5A3.3 3.3 0 008 19z"/>',
  tips: '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>',
  mystery: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l6 6"/>',
  blog: '<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5M8 8h7M8 12h7"/>',
  board: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  o_summary: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9h9M12 12l-6.4 6.4"/>',

function api(action, extra) {

  return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
    .then(function (r) { return r.json(); }, function () { throw mkErr('network', '通信できませんでした。電波の良い場所で、もう一度お試しください。'); })
    .then(function (j) {
      if (j && j.ok) return j.data;
      var code = j && j.error;
      if ((code === 'token_expired' || code === 'token_invalid') && window.liff && !window.__previewApi) { try { liff.logout(); liff.login({ redirectUri: location.href }); } catch (e) { /* 下で表示 */ } }
      throw mkErr(code || 'server', (j && j.message) || '処理に失敗しました。');

      '<div class="card"><h2>LINE登録のご家族</h2>' + (r.family && r.family.length ? r.family.map(function (f) { return '<div class="mrow first" style="border:0;padding:4px 0"><span class="nm">' + esc(f.name) + '</span> <span class="muted">' + esc(f.relation) + '</span></div>'; }).join('') : '<p class="muted">登録はありません。</p>') + '</div>';
  }
  $('#sres').innerHTML = h; bindMaps($('#sres'));
  Array.prototype.forEach.call(document.querySelectorAll('#sres [data-id]'), function (b) {
    b.onclick = function () {
      b.disabled = true;
      api('o_receive', { id: b.dataset.id, received: b.dataset.r === '1' }).then(function (x) {
        r.apps.forEach(function (a) { if (a.id === x.id) { a.received = x.received; a.receivedAt = x.receivedAt; } });
        drawScan(r); toast(x.received ? '受取済みにしました' : '取り消しました');
      }).catch(function (e) { b.disabled = false; toast(e.message); });
    };
  });
}

/* ---------- メールBOX ---------- */
function fmtMd(t) { t = String(t || ''); return t.length >= 16 ? (+t.slice(5, 7)) + '/' + (+t.slice(8, 10)) + ' ' + t.slice(11, 16) : t; }
function setBadge(n) { if (!S.me) return; S.me.badges = Object.assign({}, S.me.badges, { mail: n }); var h = (location.hash || '').replace('#', '').split('/')[0]; renderNav(h); }
var MB = { filter: 'all' };
function statusTag(st) { return st ? '<span class="tg ' + (st === '対応済み' ? 'ok' : 'warn') + '">' + esc(st) + '</span>' : ''; }
function mailView() {
  sub('メールBOX', '<div class="skel" style="height:260px"></div>');
  api('mail_list').then(function (d) {
    setBadge(d.unread);
    var staff = d.canBroadcast;
    var head = '<button class="btn" id="mnew">' + (staff ? '✉ 新しいメールを送る' : '✉ 役員に問い合わせる') + '</button>' +
      '<div class="chips" style="margin:14px 0 4px" id="mf"><button data-f="all" aria-pressed="true">すべて</button><button data-f="unread" aria-pressed="false">未読 ' + d.unread + '</button>' + (staff || d.mails.some(function (m) { return m.mine; }) ? '<button data-f="todo" aria-pressed="false">未対応</button>' : '') + '</div>';
    function draw() {
      var rows = d.mails.filter(function (m) { return MB.filter === 'all' || (MB.filter === 'unread' ? m.unread : m.status === '未対応'); });
      $('#mlist').innerHTML = rows.length ? rows.map(function (m) {
        return '<button class="ml' + (m.unread ? ' un' : '') + '" data-id="' + esc(m.id) + '">' + (m.unread ? '<i class="dt" role="img" aria-label="未読"></i>' : '') +
          '<div class="sj">' + esc(m.subject) + '</div><div class="mt">' + esc(m.mine ? '送信 → ' + m.to : m.sender) + ' ・ ' + esc(fmtMd(m.date)) + '</div>' +
          (m.important ? '<span class="tg imp">重要</span>' : '') + (m.kind === '問い合わせ' ? '<span class="tg">問い合わせ</span>' : '') + statusTag(m.status) + (m.replies ? '<span class="tg">返信 ' + m.replies + '</span>' : '') + '</button>';
      }).join('') : '<div class="card"><p class="muted" style="margin:0">' + (MB.filter === 'all' ? 'メールはまだありません。' : 'この条件のメールはありません。') + '</p></div>';
      Array.prototype.forEach.call(document.querySelectorAll('#mlist .ml'), function (b) { b.onclick = function () { go('mail/' + b.dataset.id); }; });
    }
    sub('メールBOX', head + '<div id="mlist"></div><p class="small" style="margin:8px 4px">掲載は' + d.days + '日間です。過ぎたメールは自動で消えます。LINEへの通知は届かないので、このアプリを開いたときに赤い印でお知らせします。</p>');
    $('#mnew').onclick = function () { go('mailnew'); };
    Array.prototype.forEach.call(document.querySelectorAll('#mf button'), function (b) { b.setAttribute('aria-pressed', b.dataset.f === MB.filter ? 'true' : 'false'); b.onclick = function () { MB.filter = b.dataset.f; Array.prototype.forEach.call(document.querySelectorAll('#mf button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); draw(); }; });
    draw();
  }).catch(function (e) { offErr('メールBOX', e, 'home'); });
}
function mailDetailView(id) {
  sub('メール', '<div class="skel" style="height:300px"></div>', 'mail');
  api('mail_get', { id: id }).then(function (m) { setBadge(m.badge); drawMail(m); }).catch(function (e) { offErr('メール', e, 'mail'); });
}
function drawMail(m) {
  var h = '<div class="card"><div style="font-size:19px;font-weight:700;line-height:1.4">' + esc(m.subject) + '</div>' +
    '<div class="muted" style="margin-top:4px">' + esc(m.mine ? '送信 → ' + m.to : m.sender) + ' ・ ' + esc(fmtMd(m.date)) + '</div>' +
    (m.important ? '<span class="tg imp">重要</span>' : '') + (m.kind === '問い合わせ' ? '<span class="tg">問い合わせ</span>' : '') + (m.mine ? '' : '<span class="tg">宛先: ' + esc(m.to) + '</span>') +
    '<div class="mbody">' + linkify(m.body) + '</div>' +
    (m.readers ? '<p class="small" style="margin:14px 0 0">既読 ' + m.readers.length + '人' + (m.readers.length ? ':' + m.readers.map(function (r) { return ' ' + esc(r.name); }).join('') : '') + '</p>' : '') +
    (m.repliers && m.repliers.length ? '<p class="small" style="margin:2px 0 0">返信あり:' + m.repliers.map(function (n) { return ' ' + esc(n); }).join('') + '</p>' : '') +
    '<p class="small" style="margin:6px 0 0">' + esc(m.expires) + ' まで掲載</p></div>';
  if (m.status) {
    h += '<div class="card"><h2>対応状況</h2><p style="margin:0 0 10px">' + statusTag(m.status) + (m.status === '対応済み' ? '<span class="muted"> ' + esc(m.handler) + ' さん ・ ' + esc(fmtMd(m.handledAt)) + '</span>' : '') + '</p>' +
      (m.canStatus ? '<button class="btn ghost" id="mst">' + (m.status === '対応済み' ? '未対応に戻す' : '対応済みにする') + '</button>' : '') + '</div>';
  }
  h += '<div class="card"><h2>返信' + (m.replies.length ? '(' + m.replies.length + ')' : '') + '</h2>' + (m.replies.length ? m.replies.map(function (r) {
    return '<div class="rp' + (r.mine ? ' me' : '') + '"><div class="who">' + esc(r.mine ? 'あなた' : r.name) + ' ・ ' + esc(fmtMd(r.at)) + '</div><div class="tx">' + linkify(r.body) + '</div></div>';
  }).join('') : '<p class="muted" style="margin:0 0 8px">まだ返信はありません。</p>') +
    '<textarea class="inp" id="rbody" maxlength="2000" placeholder="返信を書く" aria-label="返信"></textarea><div style="height:10px"></div><button class="btn" id="rsend">返信を送る</button>' +
    '<p class="small" style="margin:8px 0 0">返信は、あなたと送信者・役員だけに見えます。</p></div>';
  if (m.canDelete) h += '<button class="btn ghost" id="mdel" style="color:var(--bad);border-color:var(--bad)">' + (m.mine ? '送信を取り消す(削除)' : 'このメールを削除する') + '</button><div style="height:20px"></div>';
  sub('メール', h, 'mail');
  var st = $('#mst'); if (st) st.onclick = function () { st.disabled = true; api('mail_status', { id: m.id, status: m.status === '対応済み' ? '未対応' : '対応済み' }).then(function (x) { m.status = x.status; m.handler = x.handler; m.handledAt = x.handledAt; var y = window.scrollY; drawMail(m); window.scrollTo(0, y); toast(x.status + 'にしました'); }).catch(function (e) { st.disabled = false; toast(e.message); }); };
  $('#rsend').onclick = function () {
    var t = $('#rbody').value; if (!t.trim()) return toast('返信の内容を入力してください');
    var b = $('#rsend'); b.disabled = true;
    api('mail_reply', { id: m.id, body: t }).then(function () { toast('返信しました'); mailDetailView(m.id); }).catch(function (e) { b.disabled = false; toast(e.message); });
  };
  var dl = $('#mdel'); if (dl) dl.onclick = function () {
    if (!window.confirm(m.mine ? 'このメールの送信を取り消します(受け取った方からも消えます)。よろしいですか?' : 'このメールを削除します。よろしいですか?')) return;
    dl.disabled = true; api('mail_delete', { id: m.id }).then(function () { toast('削除しました'); go('mail'); }).catch(function (e) { dl.disabled = false; toast(e.message); });
  };
}
var MT = { type: '全員' };
function mailNewView() {
  var staff = isOfficer();
  if (!staff) return drawMailNew(null);
  sub('新しいメール', '<div class="skel" style="height:300px"></div>', 'mail');
  api('mail_targets').then(drawMailNew).catch(function (e) { offErr('新しいメール', e, 'mail'); });
}
function drawMailNew(tg) {
  var staff = !!tg, types = [['全員', '全員'], ['役員', '役員のみ'], ['班', '班'], ['個人', '個人'], ['イベント', '申込者']];
  var h = '<div class="card">';
  if (staff) {
    h += '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">宛先</span><div class="chips" id="mtype" style="margin-bottom:6px">' + types.map(function (t) { return '<button data-t="' + t[0] + '" aria-pressed="' + (MT.type === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div><div id="msub"></div></div>';
  } else h += '<div class="notice-box">役員全員に届きます。お返事は、このメールBOXで確認できます。</div>';
  h += '<div class="field"><label class="l" for="msj">件名<span class="req">必須</span></label><input class="inp" id="msj" maxlength="80"></div>' +
    '<div class="field"><label class="l" for="mbd">本文<span class="req">必須</span></label><textarea class="inp" id="mbd" maxlength="3000" style="min-height:160px"></textarea></div>' +
    (staff ? '<label class="opt" style="margin-bottom:16px"><input type="checkbox" id="mimp"><span>重要(赤い印をつける)</span></label>' : '') +
    '<button class="btn" id="msend">' + (staff ? '送信する' : '役員に送る') + '</button><p class="small" style="margin:8px 0 0">送ったメールは30日で自動で消えます。送信後も、メールBOXから取り消せます。</p></div>';
  sub(staff ? '新しいメール' : '役員に問い合わせる', h, 'mail');
  var picks = {};
  function drawSub() {
    var t = MT.type, el = $('#msub'); if (!el) return;
    if (t === '班') el.innerHTML = '<select class="inp" id="mval" aria-label="班">' + tg.groups.map(function (g) { return '<option>' + esc(g) + '</option>'; }).join('') + '</select><p class="hint" style="margin-top:6px">その班の、LINE登録済みの会員に届きます。</p>';
    else if (t === 'イベント') el.innerHTML = '<select class="inp" id="mval" aria-label="イベント">' + tg.events.map(function (e) { return '<option value="' + esc(e.name) + '">' + esc(e.name) + '(' + tg.year + '年・申込 ' + e.members + '会員)</option>'; }).join('') + '</select><p class="hint" style="margin-top:6px">今年の申込がある会員(LINE登録済み)に届きます。</p>';
    else if (t === '個人') {
      el.innerHTML = '<input class="inp" id="mq" placeholder="名前で絞り込み" aria-label="名前で絞り込み" style="margin-bottom:8px"><div class="plist" id="plist"></div><p class="hint" id="pcnt" style="margin-top:6px"></p>';
      var draw = function () {
        var q = $('#mq').value.trim();
        $('#plist').innerHTML = tg.people.filter(function (p) { return !q || String(p.name).indexOf(q) >= 0; }).map(function (p) { return '<label><input type="checkbox" data-id="' + esc(p.id) + '"' + (picks[p.id] ? ' checked' : '') + '><span>' + esc(p.name) + '</span></label>'; }).join('') || '<p class="muted">該当する方がいません。</p>';
        Array.prototype.forEach.call(document.querySelectorAll('#plist input'), function (c) { c.onchange = function () { if (c.checked) picks[c.dataset.id] = 1; else delete picks[c.dataset.id]; $('#pcnt').textContent = Object.keys(picks).length + '人を選択中'; }; });
        $('#pcnt').textContent = Object.keys(picks).length + '人を選択中';
      };
      $('#mq').oninput = draw; draw();
    } else el.innerHTML = '<p class="hint">' + (t === '全員' ? 'LINE登録済みの全会員に届きます。' : '役員・管理者に届きます。') + '</p>';
  }
  if (staff) {
    drawSub();
    Array.prototype.forEach.call(document.querySelectorAll('#mtype button'), function (b) { b.onclick = function () { MT.type = b.dataset.t; Array.prototype.forEach.call(document.querySelectorAll('#mtype button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); drawSub(); }; });
  }
  $('#msend').onclick = function () {
    var subj = $('#msj').value.trim(), body = $('#mbd').value.trim();
    if (!subj || !body) return toast('件名と本文を入力してください');
    var req = { subject: subj, body: body };
    if (staff) {
      req.targetType = MT.type; req.important = $('#mimp').checked;
      if (MT.type === '班' || MT.type === 'イベント') req.targetValue = $('#mval').value;
      if (MT.type === '個人') { req.targetIds = Object.keys(picks); if (!req.targetIds.length) return toast('宛先の方を選んでください'); }
      if (MT.type === '全員' && !window.confirm('全員に送ります。よろしいですか?')) return;
    }
    var b = $('#msend'); b.disabled = true;
    api('mail_send', req).then(function () { toast('送信しました'); go('mail'); }).catch(function (e) { b.disabled = false; toast(e.message); });
  };
}

/* ---------- ルーティング ---------- */
function loadMe() { return api('me').then(function (me) { S.me = me; return me; }); }
function route() {
  var me = S.me; if (!me) return;
  if (me.state !== 'approved') return me.state === 'none' ? formView(null, false) : statusView();
  var full = (location.hash || '').replace('#', ''), h = full.split('/')[0];
  var officerOnly = /^(officer|o_sum|o_unpaid|o_circ|o_scan)$/.test(h);
  if (officerOnly && !isOfficer()) h = '';
  renderNav(h);
  if (h === 'mail' && full.indexOf('/') > 0) return mailDetailView(full.split('/')[1]);
  ({ card: cardView, dash: dashView, suginami: suginamiView, weather: weatherView, mail: mailView, mailnew: mailNewView, officer: officerView, o_sum: sumView, o_unpaid: unpaidView, o_circ: circView, o_scan: scanView }[h] || homeView)();
}
window.addEventListener('hashchange', route);

function boot() {
  var p;
  if (CFG.ALLOW_PREVIEW && /[?&]preview=/.test(location.search)) {
    var s = document.createElement('script'); s.src = 'preview.js';
    p = new Promise(function (ok, ng) { s.onload = ok; s.onerror = function () { ng(new Error('preview.js がありません')); }; document.head.appendChild(s); });
  } else {
    if (!window.liff) return fatal(new Error('LINEの機能を読み込めませんでした。通信状況をご確認ください。'));
    if (!CFG.LIFF_ID || !CFG.API_URL) return fatal(new Error('設定(config.js)が未完了です。'));
    p = liff.init({ liffId: CFG.LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function () {}); }
    });
  }
  p.then(loadMe).then(route).catch(fatal);
}
boot();
})();
</script>
</body>
