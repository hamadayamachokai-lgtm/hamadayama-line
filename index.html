<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>浜田山町会 LINE会員</title>
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#1b2438; --sub:#667085; --line:#e4ddcf;
  --navy:#1f3a5f; --navy2:#2f4b7c; --navy3:#12243f; --gold:#b8934a; --red:#c4472f;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fcefd3; --bad:#b3261e; --bad-bg:#fbe5e2; --mute-bg:#ece8de;
  --r:16px; --sh:0 1px 2px rgba(27,36,56,.06),0 6px 20px rgba(27,36,56,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
#app{max-width:520px;margin:0 auto;min-height:100vh}body.deskmode #app{max-width:1100px}
.pad{padding:16px}
h1,h2,h3{margin:0;line-height:1.35}
.muted{color:var(--sub);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 上部バー */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;background:rgba(243,239,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{width:48px;height:48px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.top .back:active{background:var(--mute-bg)}
.top h1{font-size:18px;font-weight:700;flex:1}
.top .pad-r{width:12px}

/* ヒーロー */
.hero{margin:0;padding:28px 20px 56px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(184,147,74,.35),transparent 55%),linear-gradient(160deg,var(--navy3),var(--navy) 60%,var(--navy2))}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;
  background:repeating-radial-gradient(circle at 0 100%,transparent 0 14px,#fff 14px 15px)}
.hero .brand{position:relative;font-size:13px;letter-spacing:.28em;opacity:.8}
.hero h1{position:relative;font-size:24px;margin-top:6px;font-weight:700}
.hero .sub{position:relative;opacity:.85;margin-top:2px;font-size:15px}
.chip{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.chip.role{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.mute{background:var(--mute-bg);color:var(--sub)}
.sheet{margin:-36px 12px 0;position:relative}
.sheet.flat{margin-top:0}
.hero.short{padding-bottom:28px}

/* カード・ボタン */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border:0;border-radius:14px;
  background:var(--navy);color:#fff;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.55}
.btns{display:grid;gap:10px;margin-top:16px}

/* メニュー */
.sec{margin:22px 4px 8px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--sub);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:98px;padding:12px 4px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;text-align:center;font-weight:700;font-size:13px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.tile svg{width:32px;height:32px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile:active{transform:scale(.97)}
.tile.soon{background:#f7f4ec;box-shadow:none}
.tile.soon svg{stroke:#a3a9b5} .tile.soon{color:#7d8696}
.tile .tag{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;color:var(--sub);background:var(--mute-bg);padding:0 6px;border-radius:999px;line-height:1.7}
.tile.officer svg{stroke:var(--red)}

/* フォーム */
.field{margin-bottom:18px}
.field label.l{display:block;font-weight:700;margin-bottom:2px}
.field .req{color:var(--red);font-size:12px;margin-left:6px;font-weight:700}
.field .hint{font-size:13.5px;color:var(--sub);margin:0 0 6px;line-height:1.5}
.inp{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(47,75,124,.15)}
textarea.inp{min-height:96px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600}
.opt input{width:22px;height:22px;accent-color:var(--navy)}
.opt:has(input:checked){border-color:var(--navy2);background:#eef2f9}
.err{color:var(--bad);font-size:14px;margin-top:6px;font-weight:600}
.notice-box{border-left:4px solid var(--gold);background:#fbf6e9;padding:12px 14px;border-radius:0 12px 12px 0;font-size:14.5px;margin-bottom:16px}

/* 状況画面 */
.center{text-align:center;padding:36px 8px 8px}
.bigicon{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--mute-bg)}
.bigicon svg{width:38px;height:38px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bigicon.bad{background:var(--bad-bg)} .bigicon.bad svg{stroke:var(--bad)}
.bigicon.warn{background:var(--warn-bg)} .bigicon.warn svg{stroke:var(--warn)}
.kv{display:grid;grid-template-columns:7.2em 1fr;gap:6px 10px;font-size:15px;margin:0}
.kv dt{color:var(--sub)} .kv dd{margin:0;word-break:break-all}

/* 会員証 */
.mcard{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:22px 20px 20px;box-shadow:0 14px 30px rgba(18,36,63,.35);
  background:radial-gradient(120% 80% at 100% 0%,rgba(184,147,74,.45),transparent 55%),linear-gradient(155deg,var(--navy3),var(--navy) 60%,var(--navy2))}
.mcard::before{content:"";position:absolute;inset:0;opacity:.07;background:repeating-radial-gradient(circle at 0 100%,transparent 0 14px,#fff 14px 15px)}
.mcard>*{position:relative}
.mcard .t1{font-size:12px;letter-spacing:.3em;opacity:.8}
.mcard .t2{font-size:20px;font-weight:700;margin-bottom:14px}
.mcard .nm{font-size:26px;font-weight:700;line-height:1.3;word-break:break-all}
.mcard .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px;font-size:14px;opacity:.95}
.mcard .no{font-size:20px;font-weight:700;letter-spacing:.04em}
.qrbox{background:#fff;border-radius:16px;padding:10px;margin:18px auto 8px;width:min(66vw,260px);aspect-ratio:1}
.qrbox svg{display:block;width:100%;height:100%}
.mcard .code{text-align:center;font-size:20px;letter-spacing:.24em;font-weight:700;font-variant-numeric:tabular-nums}
.mcard .gold{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 0}

/* ダッシュボード */
.feebig{display:flex;align-items:center;gap:14px}
.feebig .dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.feebig .dot svg{width:30px;height:30px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.feebig.ok .dot{background:var(--ok-bg)} .feebig.ok .dot svg{stroke:var(--ok)}
.feebig.warn .dot{background:var(--warn-bg)} .feebig.warn .dot svg{stroke:var(--warn)}
.feebig.mute .dot{background:var(--mute-bg)} .feebig.mute .dot svg{stroke:var(--sub)}
.feebig .big{font-size:22px;font-weight:700;line-height:1.2}
.years{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ntc{border-top:1px solid var(--line);padding:12px 0}
.ntc:first-child{border-top:0;padding-top:0}
.ntc button{all:unset;display:block;width:100%;cursor:pointer}
.ntc .d{font-size:12.5px;color:var(--sub)}
.ntc .ti{font-weight:700}
.ntc .bd{display:none;margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.ntc.open .bd{display:block}

/* 天気・防災 */
.banner{border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.banner.ok{background:var(--ok-bg);color:#14583a} .banner.advisory{background:var(--warn-bg);color:#6e4100}
.banner.warning{background:#fbe0dc;color:#8d1d16} .banner.special{background:#5a1d6b;color:#fff}
.banner b{font-size:17px}
.wlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.wlist li{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:var(--ink);font-weight:600}
.links a::after{content:"›";font-size:22px;color:var(--sub)}
.today{display:flex;align-items:center;gap:16px}
.today svg.wi{width:84px;height:84px;flex:none}
.today .tx{font-size:20px;font-weight:700;line-height:1.35}
.tm{display:flex;gap:18px;margin-top:10px;font-weight:700}
.tm .lo{color:#2563a8} .tm .hi{color:var(--red)}
.pops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pops div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:13px}
.pops b{display:block;font-size:18px}
.wk{display:grid;grid-template-columns:5.6em 34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wk:first-of-type{border-top:0}
.wk svg{width:30px;height:30px}
.wk .tt{text-align:right;font-weight:700;white-space:nowrap}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,#ebe6da,#f5f1e8,#ebe6da);background-size:200% 100%;animation:sk 1.4s infinite linear;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:88vw;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:20;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 下のタブ(どの画面からでも、閉じずに移動できる) */
.bnav{overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:6;width:min(100%,520px);display:flex;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.bnav button{all:unset;position:relative;flex:0 0 auto;width:calc(100% / 5.5);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;border-radius:12px}
.bnav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current=page]{color:var(--navy);background:#eef2f9}
.bnav::-webkit-scrollbar{display:none}
.bnav button{scroll-snap-align:start}
.bnav button.off{color:var(--red)}
.bnav button.soon svg,.bnav button.soon span{opacity:.5}
.bnav button span{white-space:nowrap}
.bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#d92d20;color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700;border:2px solid #fffdf8;line-height:14px}
.tile .bdg{top:8px;left:8px}
.bdg.g{background:#2e9e5b}.bdg.y{background:#e8a317;color:#3a2a00}.bdg.r{background:#d92d20}
.sch{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.sch .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sch .dt{font-weight:800;font-size:17px}
.sch .tt{font-size:16px;font-weight:700;margin:6px 0 0}.sch .pl{color:var(--sub);font-size:14px}
.lvc{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:800}.lvc.g{background:#e3f5ea;color:#1e7a45}.lvc.y{background:#fff1c9;color:#8a5a00}.lvc.r{background:#fde4e1;color:#b42318}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ans button{padding:11px 4px;border-radius:10px;border:1.5px solid #cfc8b8;background:#fff;font-size:15px;font-weight:700;color:var(--ink)}
.ans button.on.a0{background:#2e9e5b;color:#fff;border-color:#2e9e5b}.ans button.on.a1{background:#d92d20;color:#fff;border-color:#d92d20}.ans button.on.a2{background:#6b7280;color:#fff;border-color:#6b7280}
.sch .cn{font-size:13px;color:var(--sub);margin-top:8px}.sch details{margin-top:6px;font-size:14px}.sch summary{cursor:pointer;color:var(--navy);font-weight:700}.sch .nm{margin:4px 0}
.sch .note{margin-top:8px;padding:8px 10px;border-left:4px solid var(--gold);background:#fbf5e6;border-radius:6px;font-size:14px}.sch .note b{display:block}.sch .note .by{color:var(--sub);font-size:12px}.sch .note .nb{white-space:pre-wrap;word-break:break-word}.sch .note img{max-width:100%;border-radius:8px;margin-top:6px;display:block}.sch .note a.fl{display:inline-block;margin-top:6px;margin-right:8px;padding:6px 10px;border:1px solid var(--navy);border-radius:8px;color:var(--navy);font-weight:700;text-decoration:none;font-size:13px}.sch .nx{float:right;border:0;background:#eee;border-radius:6px;font-size:12px;padding:2px 8px}.sch .nform{margin-top:8px;padding:8px;border:1px dashed #cfc8b8;border-radius:8px}.sch .nform input[type=text],.sch .nform textarea{width:100%;margin-bottom:6px}
.pvrow{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 0}.pvrow .x{flex:none;border:0;background:#eee;border-radius:8px;padding:4px 10px;font-weight:700}
.bnav button:active{background:var(--mute-bg)}
body.hasnav #app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
/* 役員画面 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--navy);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{all:unset;text-align:center;padding:10px 4px;font-weight:700;color:var(--navy);cursor:pointer;min-height:24px;box-sizing:border-box;font-size:14px}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{all:unset;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.gh .hd{font-weight:700;font-size:17px}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.mrow.first{border-top:0}
.mrow .nm{font-weight:700}
.mrow .ad{font-size:14px;color:var(--sub)}
.mrow.done .nm{opacity:.55}
.mrow .acts{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{all:unset;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;font-size:14.5px;cursor:pointer;box-sizing:border-box}
.sbtn.fill{background:var(--navy);color:#fff}
.sbtn.blue{background:#1b5fc4;border-color:#1b5fc4;color:#fff}
.sbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sbtn[disabled]{opacity:.5}
.bar{height:10px;background:#e3e8ef;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.dot2{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-4px;margin-right:4px}
.dot2.on{background:var(--red)} .dot2.off{border:2px solid var(--line)}
.stable{width:100%;border-collapse:collapse;font-size:14.5px}.stable th,.stable td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}.stable th:first-child,.stable td:first-child{text-align:left}.stable th{font-size:12.5px;color:var(--sub);border-top:0}
.scanres{border-left:5px solid var(--navy)}
.scanres.good{border-left-color:var(--ok)} .scanres.warn{border-left-color:var(--warn)}
.inrow{display:flex;gap:8px}.inrow input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;letter-spacing:.1em;text-transform:uppercase;background:#fff}
/* メールBOX */
.ml{all:unset;display:block;box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 14px 12px 30px;margin-bottom:10px;position:relative;cursor:pointer}
.ml:active{transform:scale(.99)}
.ml .dt{position:absolute;left:11px;top:19px;width:11px;height:11px;border-radius:50%;background:#d92d20}
.ml .sj{font-size:16.5px;line-height:1.4}
.ml.un .sj{font-weight:700}
.ml .mt{font-size:13px;color:var(--sub);margin-top:2px}
.tg{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin:6px 6px 0 0;background:var(--mute-bg);color:var(--sub)}
.tg.imp{background:#fde4e1;color:#b3261e} .tg.warn{background:var(--warn-bg);color:var(--warn)} .tg.ok{background:var(--ok-bg);color:var(--ok)}
.mbody{white-space:pre-wrap;word-break:break-word;line-height:1.7;margin:10px 0 0}
.small{font-size:12px;color:var(--sub);line-height:1.6}
.rp{padding:10px 12px;border-radius:12px;background:#eef2f9;margin:8px 0;max-width:92%}
.rp.me{background:#e3f3ea;margin-left:auto}
.rp .who{font-size:12px;color:var(--sub);margin-bottom:2px}
.rp .tx{white-space:pre-wrap;word-break:break-word}
.plist{max-height:240px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:4px 10px}
.plist label{display:flex;gap:10px;align-items:center;min-height:44px}
.plist input{width:22px;height:22px}
/* モーダル(選択) */
.mdl{position:fixed;inset:0;z-index:30;background:rgba(16,35,63,.5);display:flex;align-items:flex-end;justify-content:center}
.mdl .box{background:#fffdf8;width:min(100%,520px);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.mdl h3{font-size:17px;margin-bottom:10px}
.mdl .sbtn{display:flex;width:100%;margin-bottom:8px;min-height:50px}
/* 推理 */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.wc{flex:0 0 84%;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.wc img{display:block;width:100%;aspect-ratio:20/13;object-fit:contain;background:#fff}
.wc .in{padding:14px 16px 16px}
.wc .pn{font-size:20px;font-weight:700}
.wc .q{font-size:14px;font-weight:700;color:#475467;margin-top:8px}
.wc .a{margin-top:8px;padding:12px;border-radius:10px;background:#f5f7fa;line-height:1.7}
.dots{display:flex;justify-content:center;gap:6px;margin:0 0 12px}.dots i{width:7px;height:7px;border-radius:50%;background:#cfd6e2}.dots i.on{background:var(--navy)}
.rk td.me,.rk tr.me td{font-weight:700;background:#fff7dd}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.thumbs button{all:unset;position:relative;width:76px;height:52px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.thumbs img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script src="config.js"></script>

<script>
(function () {
'use strict';
var CFG = window.APP_CONFIG || {};
var S = { me: null, tab: '' };
var $ = function (s, el) { return (el || document).querySelector(s); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; }); }
var toastT;
function toast(m) { var t = $('#toast'); t.textContent = m; t.className = 'on'; clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, 2600); }

/* ---------- アイコン ---------- */
var IC = {
  card: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.6-1.5 4.4-1.5 5 0M14 10h4M14 13h3"/>',
  dashboard: '<path d="M5 20V11M11 20V4M17 20v-6M3 20h18"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  event: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  help: '<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',

  tips: '<path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/>',
  mystery: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l6 6"/>',
  headchg: '<path d="M17 3l4 4-4 4M21 7H8a4 4 0 00-4 4M7 21l-4-4 4-4M3 17h13a4 4 0 004-4"/>',
  blog: '<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5M8 8h7M8 12h7"/>',
  board: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  o_summary: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9h9M12 12l-6.4 6.4"/>',
  o_sched: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h4M7 17h7"/>',
  a_sched: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',
  o_unpaid: '<circle cx="12" cy="12" r="9"/><path d="M8.5 7l3.5 5 3.5-5M12 12v5M9 13h6M9 15.5h6"/>',
  o_circ: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.3"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/>',
  o_checkin: '<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M8 12h8"/>',
  o_desk: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M8 9h8M8 12h5"/>',
  o_roster: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M8 9.5h5M8 12.5h3"/>',
  o_viewer: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M7 12l3-3 3 2 4-4"/>',
  a_admin: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  a_image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>',
  a_disaster: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  a_notice: '<path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 20a2 2 0 01-3.4 0"/>',
  a_event: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l3 3 5-5"/>',
  a_docs: '<path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/>',
  home: '<path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/>',
  officer: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  pin: '<path d="M12 21s-6-5.5-6-10a6 6 0 0112 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', hourglass: '<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/>',
  stop: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>', x: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>', dash: '<path d="M6 12h12"/>', person: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'
};
function svg(k, cls) { return '<svg viewBox="0 0 24 24" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : '') + '>' + IC[k] + '</svg>'; }
var LABEL = {
  card: '会員証', dashboard: 'ダッシュボード', mail: 'メールBOX', event: 'イベント', help: '助け合い', suginami: '杉並(防災)', weather: '天気',
  tips: '豆知識', mystery: '推理', blog: '町会ブログ', board: '町会掲示板', headchg: '回覧元変更申請',
  o_sched: '役員の予定', a_sched: '予定の登録', o_summary: '集計結果', o_unpaid: '未納者', o_circ: '回覧元', o_roster: '会員名簿', o_checkin: 'QR', o_desk: 'QR受付画面',
  o_viewer: '管理システム(閲覧)', a_admin: '管理システム', a_disaster: '災害モード', a_image: '推理の画像', a_docs: '書類の更新', a_notice: 'お知らせの更新', a_event: 'イベントの設定'
};
var SECTION = { common: 'みんなのメニュー', officer: '役員専用(役員だけに表示)', admin: '管理者専用' };

/* ---------- 通信 ---------- */
function api(action, extra) {
  if (window.__previewApi) return window.__previewApi(action, extra || {});
  var body = JSON.stringify(Object.assign({ action: action, idToken: window.liff ? liff.getIDToken() : '' }, extra || {}));
  return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
    .then(function (r) { return r.json(); }, function () { throw mkErr('network', '通信できませんでした。電波の良い場所で、もう一度お試しください。'); })
    .then(function (j) {
      if (j && j.ok) return j.data;
      var code = j && j.error;
      if ((code === 'token_expired' || code === 'token_invalid') && window.liff && !window.__previewApi && !window.__relogin) { window.__relogin = true; try { liff.logout(); liff.login({ redirectUri: location.href }); } catch (e) { /* 下で表示 */ } }
      throw mkErr(code || 'server', (j && j.message) || '処理に失敗しました。');
    });
}
function mkErr(code, msg) { var e = new Error(msg); e.code = code; return e; }

/* ---------- 画面の骨組み ---------- */
function setView(html) { try { camStop(); } catch (e) {} document.body.classList.remove('deskmode'); $('#app').innerHTML = html; $('#toast').className = ''; window.scrollTo(0, 0); }
function sub(title, body, backTo) {
  setView('<div class="top"><button class="back" id="bk" aria-label="戻る">' + svg('back').replace('<svg', '<svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"') + '</button><h1>' + esc(title) + '</h1><span class="pad-r"></span></div><div class="pad">' + body + '</div>');
  $('#bk').onclick = function () { go(backTo || 'home'); };
}
function isOfficer() { return !!(S.me && S.me.menu && S.me.menu.some(function (m) { return m.section === 'officer'; })); }
function isAdmin() { return !!(S.me && S.me.menu && S.me.menu.some(function (m) { return m.section === 'admin'; })); }
var NAVLABEL = { dashboard: 'ダッシュ', suginami: '杉並', blog: 'ブログ', board: '掲示板', help: '助け合い' };
var HASH = { card: 'card', dashboard: 'dash', suginami: 'suginami', weather: 'weather' };
function bdgCls(k) { var lv = S.me && S.me.badges && S.me.badges[k + '_lv']; return lv ? ' ' + lv : ''; }
function badgeOf(k) { var n = S.me && S.me.badges && +S.me.badges[k]; return n > 0 ? n : 0; }
function renderNav(h) {
  var el = $('#bnav');
  if (!S.me || S.me.state !== 'approved') { if (el) el.parentNode.removeChild(el); document.body.classList.remove('hasnav'); return; }
  var items = [['home', 'ホーム', 'home', true]];
  S.me.menu.forEach(function (m) { if (m.section === 'common') items.push([m.key, NAVLABEL[m.key] || LABEL[m.key], m.key, m.ready]); });
  if (isOfficer()) items.push(['officer', '役員', 'officer', true]);
  var cur = !h || h === 'home' ? 'home' : (/^(o_|a_)/.test(h) ? 'officer' : (h === 'dash' ? 'dashboard' : (h === 'mailnew' ? 'mail' : (/^ev/.test(h) ? 'event' : ((h === 'boardnew' ? 'board' : (h === 'helpnew' ? 'help' : h)))))));
  var keep = el ? el.scrollLeft : 0;
  if (!el) { el = document.createElement('nav'); el.id = 'bnav'; el.className = 'bnav'; el.setAttribute('aria-label', 'メインメニュー(横にスライドできます)'); document.body.appendChild(el); }
  el.innerHTML = items.map(function (it) {
    var n = badgeOf(it[0]);
    return '<button data-h="' + it[0] + '"' + (it[0] === cur ? ' aria-current="page"' : '') + ' class="' + (it[0] === 'officer' ? 'off ' : '') + (it[3] ? '' : 'soon') + '">' + svg(it[2]) + (n ? '<b class="bdg' + bdgCls(it[0]) + '" aria-label="' + (bdgCls(it[0]) ? '3日以内の予定' : '未読') + n + '件">' + (n > 99 ? '99+' : n) + '</b>' : '') + '<span>' + esc(it[1]) + '</span></button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) {
    b.onclick = function () {
      var k = b.dataset.h;
      if (k === 'home' || k === 'officer') return go(k);
      var m = S.me.menu.filter(function (x) { return x.key === k; })[0];
      if (m && !m.ready) return toast(m.note ? '「' + LABEL[k] + '」は、' + m.note + 'です(災害モードがONのときに使えます)' : '「' + LABEL[k] + '」は準備中です。もうしばらくお待ちください');
      openTile(k);
    };
  });
  el.scrollLeft = keep;
  var c = el.querySelector('[aria-current]'); if (c && c.offsetLeft + c.offsetWidth > el.scrollLeft + el.clientWidth || c && c.offsetLeft < el.scrollLeft) el.scrollLeft = Math.max(0, c.offsetLeft - 40);
  document.body.classList.add('hasnav');
}
function go(name) { if (location.hash !== '#' + name) location.hash = name; else route(); }
function fatal(e) {
  setView('<div class="pad"><div class="center"><div class="bigicon bad">' + svg('alert') + '</div><h2>表示できませんでした</h2><p class="muted">' + esc(e && e.message || e) + '</p></div><div class="btns"><button class="btn" id="rt">もう一度読み込む</button></div></div>');
  $('#rt').onclick = function () { location.reload(); };
}

/* ---------- 登録フォーム ---------- */
function formView(prefill, isEdit) {
  var me = S.me, f = prefill || {}, rel = f.relation || '';
  var relHtml = me.relations.map(function (r) {
    return '<label class="opt"><input type="radio" name="rel" value="' + esc(r) + '"' + (rel === r ? ' checked' : '') + '><span>' + esc(r) + '</span></label>';
  }).join('');
  setView('<div class="hero"><div class="brand">HAMADAYAMA</div><h1>' + (isEdit ? '申請内容の修正' : 'LINE会員の登録') + '</h1><div class="sub">浜田山町会</div></div>' +
    '<div class="pad sheet"><div class="card">' +
    '<div class="notice-box">町会費の納入状況を役員が確認して、承認します。<br>承認の連絡は届きませんので、数日後にこの画面をもう一度開いてご確認ください。</div>' +
    '<form id="rf" novalidate>' +
    '<div class="field"><label class="l" for="f1">LINE会員氏名<span class="req">必須</span></label><p class="hint">ご本人のお名前(フルネーム)をご入力ください。</p><input class="inp" id="f1" autocomplete="name" maxlength="30" value="' + esc(f.lineName || me.displayName || '') + '"><div class="err" id="e1"></div></div>' +
    '<div class="field"><label class="l" for="f2">町会費納入者のお名前<span class="req">必須</span></label><p class="hint">町会費をお支払いいただいている方(世帯主など)のお名前です。<b>管理組合で加入している場合は、建物名(マンション名)</b>をご入力ください。</p><input class="inp" id="f2" maxlength="60" value="' + esc(f.payerName || '') + '"><div class="err" id="e2"></div></div>' +
    '<div class="field"><label class="l" for="f3">納入者の住所<span class="req">必須</span></label><p class="hint">例えば、<br><b>3-1-1 浜田山町会マンション1120</b><br>のように、町会費納入者の住所を全部記載してください(半角・全角は問いません)。<br>※会員様が管理組合加入者の場合は、こちらに記載していただいた住所が判定基準になります。</p><input class="inp" id="f3" maxlength="100" autocomplete="street-address" value="' + esc(f.payerAddress || '') + '"><div class="err" id="e3"></div></div>' +
    '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">納入者との関係<span class="req">必須</span></span><div class="opts" id="rels" role="radiogroup">' + relHtml + '</div>' +
    '<div id="relnote" style="display:none;margin-top:10px"><p class="hint">状況を教えてください(例: 実家に同居している、マンションの管理人 など)</p><textarea class="inp" id="f4" maxlength="100">' + esc(f.relationNote || '') + '</textarea></div><div class="err" id="e4"></div></div>' +
    '<button class="btn" id="sb" type="submit">' + (isEdit ? 'この内容で修正する' : 'この内容で申請する') + '</button>' +
    (isEdit ? '<div class="btns"><button class="btn ghost" id="cn" type="button">やめる</button></div>' : '') +
    '</form></div></div>');
  function syncNote() { var r = document.querySelector('input[name=rel]:checked'); $('#relnote').style.display = r && r.value === 'どれにしたらいいかわからない' ? 'block' : 'none'; }
  Array.prototype.forEach.call(document.querySelectorAll('input[name=rel]'), function (i) { i.onchange = syncNote; });
  syncNote();
  if (isEdit) $('#cn').onclick = function () { statusView(); };
  $('#rf').onsubmit = function (ev) {
    ev.preventDefault();
    var v = { lineName: $('#f1').value.trim(), payerName: $('#f2').value.trim(), payerAddress: $('#f3').value.trim(), relation: '', relationNote: $('#f4').value.trim() };
    var r = document.querySelector('input[name=rel]:checked'); if (r) v.relation = r.value;
    var ok = true;
    function chk(id, cond, msg) { $('#' + id).textContent = cond ? '' : msg; if (!cond) ok = false; }
    chk('e1', v.lineName, 'お名前を入力してください');
    chk('e2', v.payerName, '町会費納入者のお名前を入力してください');
    chk('e3', v.payerAddress, '住所を入力してください');
    chk('e4', v.relation && (v.relation !== 'どれにしたらいいかわからない' || v.relationNote), v.relation ? '状況をご記入ください' : '関係を選んでください');
    if (!ok) { var first = document.querySelector('.err:not(:empty)'); if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    var b = $('#sb'); b.disabled = true; b.textContent = '送信中…';
    api('register', { form: v }).then(function (me2) { S.me = me2; statusView(); toast('申請を受け付けました'); })
      .catch(function (e) { b.disabled = false; b.textContent = isEdit ? 'この内容で修正する' : 'この内容で申請する'; toast(e.message); });
  };
}

/* ---------- 承認待ち・否決・停止 ---------- */
function profileHtml(p) {
  return '<dl class="kv"><dt>LINE会員氏名</dt><dd>' + esc(p.lineName) + '</dd><dt>納入者</dt><dd>' + esc(p.payerName) + '</dd><dt>住所</dt><dd>' + esc(p.payerAddress) + '</dd><dt>関係</dt><dd>' + esc(p.relation) + (p.relationNote ? '<br><span class="muted">' + esc(p.relationNote) + '</span>' : '') + '</dd></dl>';
}
function statusView() {
  var me = S.me;
  if (me.state === 'none') return formView(null, false);
  if (me.state === 'approved') return route();
  var cfg = {
    pending: { icon: 'hourglass', cls: '', t: '申請を受け付けました', d: '役員が町会費の納入状況を確認しています。承認されると、メニューが使えるようになります。' },
    rejected: { icon: 'x', cls: 'bad', t: '承認できませんでした', d: '内容をご確認のうえ、必要であれば修正して、もう一度申請してください。' },
    suspended: { icon: 'stop', cls: 'warn', t: 'ご利用を一時停止しています', d: '詳しくは、町会の役員へお問い合わせください。' },
    removed: { icon: 'stop', cls: 'bad', t: 'ご利用を終了しました', d: '詳しくは、町会の役員へお問い合わせください。' }
  }[me.state];
  var html = '<div class="card"><div class="center" style="padding:12px 0 4px"><div class="bigicon ' + cfg.cls + '">' + svg(cfg.icon) + '</div><h2 style="justify-content:center;margin-bottom:6px">' + cfg.t + '</h2><p class="muted" style="margin:0">' + cfg.d + '</p></div></div>';
  if (me.reason) html += '<div class="card"><h2>' + (me.state === 'rejected' ? '否決の理由' : me.state === 'removed' ? '削除の理由' : '停止の理由') + '</h2><p style="margin:0;white-space:pre-wrap">' + esc(me.reason) + '</p></div>';
  if (me.state !== 'suspended' && me.state !== 'removed') html += '<div class="card"><h2>申請した内容</h2>' + profileHtml(me.profile) + '</div>';

var CAM = null;

  $('#rsend').onclick = function () {

function shrinkImage(file, max) {
  return new Promise(function (ok, ng) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); ng(new Error('画像を読み込めませんでした。')); };
    img.src = url;
  });
}

  function draw() {
    var h = '<div class="card"><div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">どちらですか?</span>' + chip('hk', ['お願い', 'できます'], kind) + '<p class="hint">お願い=手伝ってほしい ／ できます=手伝えます</p></div></div>';
    if (kind === 'できます') {
      var reqs = d.items.filter(function (x) { return x.kind === 'お願い' && x.status === '公開' && !x.mine; });
      h += '<div class="sec">いま、お願いが来ています</div>' + (reqs.length ? reqs.map(function (x) { return helpCard(x, d); }).join('') : '<div class="card"><p class="muted" style="margin:0">いまは、公開中のお願いはありません。</p></div>') +
        '<div class="card"><h2>こちらから申し出る</h2><p class="muted" style="margin:0 0 10px">お願いに当てはまらないとき、「こんなことができます」と投稿できます。</p><button class="btn ghost" id="hoffer">申し出を書く</button></div><div id="hform"></div>';
    } else h += formHtml();
    sub('助け合いに参加', h, 'help');
    bind('hk', function (v) { kind = v; }, draw); bindFormSwitch();
    var o = $('#hoffer'); if (o) o.onclick = function () { $('#hform').innerHTML = formHtml(true); bindFormSwitch(); $('#hform').scrollIntoView(); };
    bindHelpButtons(function () { api('help_list').then(function (x) { HP.d = x; d = x; draw(); refreshBadges(); }).catch(function (e) { toast(e.message); }); });
  }
  function formHtml(offer) {
    return '<div class="card"><h2>' + (offer ? '「できます」を投稿' : '「お願い」を投稿') + '</h2>' +
      '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">内容の種類</span>' + chip('hc', d.cats, cat) + '</div>' +
      (offer ? '' : '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">何人ほしいですか?</span>' + chip('hs', d.scales, scale) + '</div>') +
      '<div class="field"><label class="l" for="ht">タイトル<span class="req">必須</span></label><input class="inp" id="ht" maxlength="60" placeholder="例: 倒れた棚を起こすのを手伝ってほしい"></div>' +
      '<div class="field"><label class="l" for="hb">くわしく<span class="req">必須</span></label><textarea class="inp" id="hb" maxlength="1000" style="min-height:130px" placeholder="いつ・どこ(丁目まで)・何をなど"></textarea></div>' +
      '<div class="notice-box">電話番号・番地は書かないでください。投稿はすぐ、みんなに見えます。</div><button class="btn" id="hsv">投稿する</button></div>';
  }
  function bindFormSwitch() {
    bind('hc', function (v) { cat = v; }); bind('hs', function (v) { scale = v; });
    var sv = $('#hsv'); if (sv) sv.onclick = function () {
      sv.disabled = true;
      api('help_post', { kind: kind, cat: cat, scale: kind === 'お願い' ? scale : '', title: $('#ht').value, body: $('#hb').value }).then(function (r) { toast('投稿しました'); HP.d = null; HP.tab = 'mine'; go('help'); }).catch(function (e) { sv.disabled = false; toast(e.message); });
    };
  }
  draw();
}

/* ---------- 管理者: 災害モード・書類の更新 ---------- */
function disasterView() {
  sub('災害モード', '<div class="skel" style="height:200px"></div>', 'officer');
  api('a_disaster_get').then(function (d) {
    sub('災害モード', '<div class="card"><h2>いまの状態</h2><div class="banner ' + (d.on ? 'warning' : 'ok') + '" style="margin:0"><div><b>' + (d.on ? '災害モード ON' : '平常(OFF)') + '</b><div>' + (d.on ? '「助け合い」が使えます。' + (d.since ? '(' + esc(fmtMd(d.since)) + ' から)' : '') : '「助け合い」はグレーで、使えません。') + '</div></div></div>' +
      '<div style="height:14px"></div><button class="btn ' + (d.on ? 'ghost' : 'red') + '" id="dm">' + (d.on ? '災害モードを終了する(OFF)' : '災害モードにする(助け合いをONにする)') + '</button>' +
      '<p class="small" style="margin:10px 0 0">ONにすると、会員のメニューの「助け合い」が使えるようになり、お願いの投稿があると赤いバッジが出ます。OFFにすると、助け合いは見えなくなります(投稿は残ります)。</p></div>', 'officer');
    $('#dm').onclick = function () {
      if (!window.confirm(d.on ? '災害モードを終了します。助け合いが使えなくなります。よろしいですか?' : '災害モードにします。会員全員の「助け合い」が使えるようになります。よろしいですか?')) return;
      $('#dm').disabled = true; api('a_disaster_set', { on: !d.on }).then(function () { toast(d.on ? '災害モードを終了しました' : '災害モードにしました'); loadMe().then(function () { disasterView(); }); }).catch(function (e) { $('#dm').disabled = false; toast(e.message); });
    };
  }).catch(function (e) { offErr('災害モード', e, 'officer'); });
}
function docsAdminView() {
  sub('書類の更新', '<div class="skel" style="height:200px"></div>', 'officer');
  api('a_docs_info').then(function (d) {
    sub('書類の更新', '<div class="card"><h2>格納書類の一覧</h2><dl class="kv"><dt>最後の更新</dt><dd>' + (d.at ? esc(fmtMd(d.at)) : 'まだ更新していません') + '</dd><dt>書類の数</dt><dd>' + d.count + '件</dd><dt>読み込めなかった</dt><dd>' + d.skipped + '件(ファイル名の形式が違うもの)</dd></dl>' +
      '<button class="btn" id="ds">Googleドライブから読み込み直す</button><p class="small" style="margin:10px 0 0">1丁目〜4丁目のフォルダを読みます。ファイルを追加・名前変更したあとに押してください(数分かかることがあります)。</p></div>', 'officer');
    $('#ds').onclick = function () {
      var b = $('#ds'); b.disabled = true; b.textContent = '読み込み中…しばらくお待ちください';
      api('a_docs_sync').then(function (r) { toast(r.count + '件を読み込みました'); docsAdminView(); }).catch(function (e) { b.disabled = false; b.textContent = 'Googleドライブから読み込み直す'; toast(e.message); });
    };
  }).catch(function (e) { offErr('書類の更新', e, 'officer'); });
}

var EA = {};
function eventAdminView() {
  sub('イベントの設定', '<div class="skel" style="height:240px"></div>', 'officer');
  api('a_event_get').then(function (d) {
    var STS = ['予約開始', '予約終了', 'イベント終了'];
    sub('イベントの設定', '<p class="muted" style="margin:0 4px 12px">' + esc(d.year) + '年度(年度は自動です)。LINEの予約は「予約開始」の間、イベント日の前日まで受け付けます。</p>' + d.events.map(function (ev, i) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ev.date || ''), Y = d.year;
      var opt = function (from, to, sel, unit) { var o = '<option value="">--</option>'; for (var k = from; k <= to; k++) o += '<option value="' + k + '"' + (sel === k ? ' selected' : '') + '>' + k + unit + '</option>'; return o; };
      return '<div class="card" data-e="' + i + '"><h2>' + esc(ev.name) + '</h2><span class="tg ' + (ev.open ? 'ok' : '') + '">いま: ' + esc(ev.state || '未設定') + (ev.open ? '(受付中)' : '') + '</span>' +
        '<div class="field" style="margin-top:10px"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">ステータス</span><div class="chips" id="es' + i + '">' + STS.map(function (s2) { return '<button data-s="' + s2 + '" aria-pressed="' + (ev.status === s2) + '">' + s2 + '</button>'; }).join('') + '</div><p class="hint">選ばないと「自動」: イベント日を入れると、5月1日〜前日に受け付けます。</p></div>' +
        '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">イベント日(毎年入れ直し)</span><div class="inrow" style="gap:6px"><select class="inp" id="ey' + i + '">' + opt(Y, Y + 1, m ? +m[1] : 0, '年') + '</select><select class="inp" id="em' + i + '">' + opt(1, 12, m ? +m[2] : 0, '月') + '</select><select class="inp" id="ed' + i + '">' + opt(1, 31, m ? +m[3] : 0, '日') + '</select></div></div>' +
        '<div class="field"><label class="l" for="en' + i + '">会員への案内文(任意)</label><textarea class="inp" id="en' + i + '" maxlength="600" style="min-height:90px">' + esc(ev.note) + '</textarea></div>' +
        '<button class="btn" data-sv="' + i + '">保存する</button></div>';
    }).join(''), 'officer');
    d.events.forEach(function (ev, i) {
      EA[i] = ev.status;
      Array.prototype.forEach.call(document.querySelectorAll('#es' + i + ' button'), function (b) {
        b.onclick = function () { EA[i] = EA[i] === b.dataset.s ? '' : b.dataset.s; Array.prototype.forEach.call(document.querySelectorAll('#es' + i + ' button'), function (x) { x.setAttribute('aria-pressed', x.dataset.s === EA[i] ? 'true' : 'false'); }); };
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sv]'), function (b) {
      b.onclick = function () {
        var i = +b.dataset.sv, ev = d.events[i], y = $('#ey' + i).value, mo = $('#em' + i).value, dd = $('#ed' + i).value;
        if ((y || mo || dd) && !(y && mo && dd)) return toast('イベント日は、年・月・日をそろえて選んでください');
        b.disabled = true;
        api('a_event_set', { event: ev.name, status: EA[i] || '', date: y ? y + '-' + mo + '-' + dd : '', note: $('#en' + i).value }).then(function () { toast('保存しました'); eventAdminView(); }).catch(function (e) { b.disabled = false; toast(e.message); });
      };
    });
  }).catch(function (e) { offErr('イベントの設定', e, 'officer'); });
}
var NA = { list: [] };
function noticeAdminView() {
  sub('お知らせの更新', '<div class="skel" style="height:240px"></div>', 'officer');
  api('a_notice_list').then(function (d) {
    NA.today = d.today; NA.list = d.notices;
    sub('お知らせの更新', '<button class="btn" id="nnew">＋ 新しいお知らせ</button><div style="height:12px"></div>' + (d.notices.length ? d.notices.map(function (n) {
      return '<button class="ml" data-id="' + esc(n.id) + '"><div class="sj">' + esc(n.title) + '</div><div class="mt">' + esc(n.from || '') + (n.to ? ' 〜 ' + esc(n.to) : ' 〜') + ' ・ ' + esc(n.audience) + '</div>' + (n.published ? '' : '<span class="tg warn">非公開</span>') + (n.to && n.to < d.today ? '<span class="tg">終了</span>' : '') + '</button>';
    }).join('') : '<div class="card"><p class="muted" style="margin:0">お知らせはまだありません。</p></div>') + '<p class="small" style="margin:8px 4px">ここで作ったお知らせは、会員のダッシュボード「町会からのお知らせ」に出ます(新しいものは赤バッジ)。</p>', 'officer');
    $('#nnew').onclick = function () { noticeEditView(null); };
    Array.prototype.forEach.call(document.querySelectorAll('.ml[data-id]'), function (b) { b.onclick = function () { noticeEditView(NA.list.filter(function (x) { return x.id === b.dataset.id; })[0]); }; });
  }).catch(function (e) { offErr('お知らせの更新', e, 'officer'); });
}
function noticeEditView(n) {
  n = n || { id: '', title: '', body: '', audience: 'すべて', from: NA.today, to: '', published: true };
  sub(n.id ? 'お知らせを直す' : '新しいお知らせ', '<div class="card"><div class="field"><label class="l" for="nt">タイトル<span class="req">必須</span></label><input class="inp" id="nt" maxlength="80" value="' + esc(n.title) + '"></div>' +
    '<div class="field"><label class="l" for="nb">本文<span class="req">必須</span></label><textarea class="inp" id="nb" maxlength="3000" style="min-height:160px">' + esc(n.body) + '</textarea></div>' +
    '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">見られる人</span><div class="chips" id="na">' + ['すべて', '役員以上'].map(function (a) { return '<button data-a="' + a + '" aria-pressed="' + (a === n.audience) + '">' + a + '</button>'; }).join('') + '</div></div>' +
    '<div class="field"><label class="l" for="nf">公開開始(2026-10-26 の形)</label><input class="inp" id="nf" maxlength="10" value="' + esc(n.from) + '"></div>' +
    '<div class="field"><label class="l" for="ne">公開終了(空なら、ずっと)</label><input class="inp" id="ne" maxlength="10" value="' + esc(n.to) + '"></div>' +
    '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">公開</span><div class="chips" id="np">' + [['公開する', true], ['非公開(下書き)', false]].map(function (a) { return '<button data-p="' + a[1] + '" aria-pressed="' + (a[1] === n.published) + '">' + a[0] + '</button>'; }).join('') + '</div></div>' +
    '<button class="btn" id="nsv">保存する</button>' + (n.id ? '<div style="height:10px"></div><button class="btn ghost" id="ndl">このお知らせを削除する</button>' : '') + '</div>', 'a_notice');
  var aud = n.audience, pub = n.published;
  function chips(id, set) { Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) { b.onclick = function () { set(b); Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }; }); }
  chips('na', function (b) { aud = b.dataset.a; }); chips('np', function (b) { pub = b.dataset.p === 'true'; });
  $('#nsv').onclick = function () { var b = $('#nsv'); b.disabled = true; api('a_notice_save', { id: n.id, title: $('#nt').value, body: $('#nb').value, audience: aud, from: $('#nf').value, to: $('#ne').value, published: pub }).then(function () { toast('保存しました'); go('a_notice'); noticeAdminView(); }).catch(function (e) { b.disabled = false; toast(e.message); }); };
  if (n.id) $('#ndl').onclick = function () { askChoice('このお知らせを削除します', ['削除する'], '元に戻せません。').then(function (v) { if (!v) return; api('a_notice_delete', { id: n.id }).then(function () { toast('削除しました'); go('a_notice'); noticeAdminView(); }).catch(function (e) { toast(e.message); }); }); };
}

/* ---------- ルーティング ---------- */
function loadMe() { return api('me').then(function (me) { S.me = me; return me; }); }
function route() {
  var me = S.me; if (!me) return;
  if (me.state !== 'approved') return me.state === 'none' ? formView(null, false) : statusView();
  var full = (location.hash || '').replace('#', ''), h = full.split('/')[0];
  var officerOnly = /^(officer|o_sum|o_unpaid|o_circ|o_roster|o_scan|o_scanrun|o_search|o_desk|o_sched|o_docs|o_doc)$/.test(h);
  if ((officerOnly && !isOfficer()) || (/^(a_img|a_disaster|a_docs|a_notice|a_event|a_sched)$/.test(h) && !isAdmin())) h = '';
  renderNav(h);
  var seg = full.split('/')[1];
  if (h === 'mail' && seg) return mailDetailView(seg);
  if (h === 'board' && seg) return boardDetailView(seg);
  if (h === 'evguardian') return evGuardianView();
  if (h === 'evapply' && seg) return evApplyView(decodeURIComponent(seg));
  if (h === 'evperson' && seg) return evPersonView(seg);
  if (h === 'evreg' && seg) return evRegView(decodeURIComponent(seg));
  if (h === 'o_docs' && seg) return docsView(decodeURIComponent(seg));
  ({ o_sched: schedView, a_sched: schedAdminView, o_desk: deskView, o_scanrun: scanView, o_search: searchView, card: cardView, dash: dashView, suginami: suginamiView, weather: weatherView, mail: mailView, mailnew: mailNewView, event: eventView, tips: tipsView, board: boardView, boardnew: boardNewView, help: helpView, helpnew: helpNewView, mystery: mysteryView, a_img: imgAdminView, a_disaster: disasterView, a_docs: docsAdminView, a_notice: noticeAdminView, a_event: eventAdminView, officer: officerView, o_sum: sumView, o_unpaid: unpaidView, o_circ: circView, o_roster: rosterView, o_scan: qrHubView }[h] || homeView)();
}
window.addEventListener('hashchange', route);

function boot() {
  var p;
  if (CFG.ALLOW_PREVIEW && /[?&]preview=/.test(location.search)) {
    var s = document.createElement('script'); s.src = 'preview.js';
    p = new Promise(function (ok, ng) { s.onload = ok; s.onerror = function () { ng(new Error('preview.js がありません')); }; document.head.appendChild(s); });
  } else {
    if (!window.liff) return fatal(new Error('LINEの機能を読み込めませんでした。通信状況をご確認ください。'));
    if (!CFG.LIFF_ID || !CFG.API_URL) return fatal(new Error('設定(config.js)が未完了です。'));
    p = liff.init({ liffId: CFG.LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function () {}); }
    });
  }
  p.then(startMe).catch(fatal);
}

/* ---------- 起動を速くする: 前回の画面を先に出し、最新は裏で取る ---------- */
var ME_KEY = 'hmt_me_';
function meSub() { try { var t = window.liff && !window.__previewApi && liff.getDecodedIDToken(); return t && t.sub || ''; } catch (e) { return ''; } }
function saveMe(me) {
  try {
    var sub = meSub(); if (!sub || !me || me.state !== 'approved') return;
    var c = JSON.parse(JSON.stringify(me)); c.profile = { lineName: me.profile && me.profile.lineName };   // 住所などは保存しない
    localStorage.setItem(ME_KEY + sub, JSON.stringify(c));
  } catch (e) { /* 保存できなくても動く */ }
}
function cachedMe() {
  try { var sub = meSub(); if (!sub) return null; var c = JSON.parse(localStorage.getItem(ME_KEY + sub) || 'null'); return c && c.state === 'approved' && c.menu && c.profile ? c : null; } catch (e) { return null; }
}
function curHash() { return (location.hash || '').replace('#', '').split('/')[0]; }
function startMe() {
  var cached = cachedMe();
  if (cached) { S.me = cached; route(); }
  var bp = api('badges').catch(function () { return null; });
  return api('me', { nobadge: true }).catch(function (e) { if (cached && e && e.code === 'network') { toast(e.message); return null; } throw e; }).then(function (me) {
    if (!me) return bp;
    if (S.me && S.me.badges) me.badges = S.me.badges;   // 新しいバッジが届くまで、前の値のまま
    var same = cached && cached.state === me.state && JSON.stringify([cached.role, cached.menu]) === JSON.stringify([me.role, me.menu]);
    S.me = me;
    if (!same) route();
    saveMe(me);
    return bp;
  }).then(function (b) {
    if (!b || !S.me || S.me.state !== 'approved') return;
    if (curHash() === 'dash') b.dashboard = 0;
    var before = JSON.stringify(S.me.badges || {}); S.me.badges = b; saveMe(S.me);
    if (JSON.stringify(b) === before) return;
    var h = curHash();
    if ((h === '' || h === 'home') && window.scrollY < 40) homeView();
    renderNav(h);
  });
}
boot();
})();
</script>
