<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>浜田山町会 LINE会員</title>
<style>
:root{
  --bg:#f3efe6; --card:#fffdf8; --ink:#1b2438; --sub:#667085; --line:#e4ddcf;
  --navy:#1f3a5f; --navy2:#2f4b7c; --navy3:#12243f; --gold:#b8934a; --red:#c4472f;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fcefd3; --bad:#b3261e; --bad-bg:#fbe5e2; --mute-bg:#ece8de;
  --r:16px; --sh:0 1px 2px rgba(27,36,56,.06),0 6px 20px rgba(27,36,56,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.65 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
#app{max-width:520px;margin:0 auto;min-height:100vh}body.deskmode #app{max-width:1100px}
.pad{padding:16px}
h1,h2,h3{margin:0;line-height:1.35}
.muted{color:var(--sub);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 上部バー */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;background:rgba(243,239,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{width:48px;height:48px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.top .back:active{background:var(--mute-bg)}
.top h1{font-size:18px;font-weight:700;flex:1}
.top .pad-r{width:12px}

/* ヒーロー */
.hero{margin:0;padding:28px 20px 56px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(184,147,74,.35),transparent 55%),linear-gradient(160deg,var(--navy3),var(--navy) 60%,var(--navy2))}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;
  background:repeating-radial-gradient(circle at 0 100%,transparent 0 14px,#fff 14px 15px)}
.hero .brand{position:relative;font-size:13px;letter-spacing:.28em;opacity:.8}
.hero h1{position:relative;font-size:24px;margin-top:6px;font-weight:700}
.hero .sub{position:relative;opacity:.85;margin-top:2px;font-size:15px}
.chip{display:inline-block;padding:1px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.chip.role{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.mute{background:var(--mute-bg);color:var(--sub)}
.sheet{margin:-36px 12px 0;position:relative}
.sheet.flat{margin-top:0}
.hero.short{padding-bottom:28px}.hnotes{position:relative;margin-top:14px;display:grid;gap:8px}.hn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);cursor:pointer;color:#fff}.hnt{font-size:14.5px;line-height:1.5;font-weight:600}.hni{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:52px}.hni svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hni small{font-size:10.5px;opacity:.85;white-space:nowrap}

/* カード・ボタン */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border:0;border-radius:14px;
  background:var(--navy);color:#fff;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.55}
.btns{display:grid;gap:10px;margin-top:16px}

/* メニュー */
.sec{margin:22px 4px 8px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--sub);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:98px;padding:12px 4px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);cursor:pointer;text-align:center;font-weight:700;font-size:13px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.tile svg{width:32px;height:32px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile:active{transform:scale(.97)}
.tile.soon{background:#f7f4ec;box-shadow:none}
.tile.soon svg{stroke:#a3a9b5} .tile.soon{color:#7d8696}
.tile .tag{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;color:var(--sub);background:var(--mute-bg);padding:0 6px;border-radius:999px;line-height:1.7}
.tile.officer svg{stroke:var(--red)}

/* フォーム */
.field{margin-bottom:18px}
.field label.l{display:block;font-weight:700;margin-bottom:2px}
.field .req{color:var(--red);font-size:12px;margin-left:6px;font-weight:700}
.field .hint{font-size:13.5px;color:var(--sub);margin:0 0 6px;line-height:1.5}
.inp{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(47,75,124,.15)}
textarea.inp{min-height:96px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-weight:600}
.opt input{width:22px;height:22px;accent-color:var(--navy)}
.opt:has(input:checked){border-color:var(--navy2);background:#eef2f9}
.err{color:var(--bad);font-size:14px;margin-top:6px;font-weight:600}
.notice-box{border-left:4px solid var(--gold);background:#fbf6e9;padding:12px 14px;border-radius:0 12px 12px 0;font-size:14.5px;margin-bottom:16px}

/* 状況画面 */
.center{text-align:center;padding:36px 8px 8px}
.bigicon{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--mute-bg)}
.bigicon svg{width:38px;height:38px;stroke:var(--navy);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bigicon.bad{background:var(--bad-bg)} .bigicon.bad svg{stroke:var(--bad)}
.bigicon.warn{background:var(--warn-bg)} .bigicon.warn svg{stroke:var(--warn)}
.kv{display:grid;grid-template-columns:7.2em 1fr;gap:6px 10px;font-size:15px;margin:0}
.kv dt{color:var(--sub)} .kv dd{margin:0;word-break:break-all}

/* 会員証 */
.mcard{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:22px 20px 20px;box-shadow:0 14px 30px rgba(18,36,63,.35);
  background:radial-gradient(120% 80% at 100% 0%,rgba(184,147,74,.45),transparent 55%),linear-gradient(155deg,var(--navy3),var(--navy) 60%,var(--navy2))}
.mcard::before{content:"";position:absolute;inset:0;opacity:.07;background:repeating-radial-gradient(circle at 0 100%,transparent 0 14px,#fff 14px 15px)}
.mcard>*{position:relative}
.mcard .t1{font-size:12px;letter-spacing:.3em;opacity:.8}
.mcard .t2{font-size:20px;font-weight:700;margin-bottom:14px}
.mcard .nm{font-size:26px;font-weight:700;line-height:1.3;word-break:break-all}
.mcard .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px;font-size:14px;opacity:.95}
.mcard .no{font-size:20px;font-weight:700;letter-spacing:.04em}
.qrbox{background:#fff;border-radius:16px;padding:10px;margin:18px auto 8px;width:min(66vw,260px);aspect-ratio:1}
.qrbox svg{display:block;width:100%;height:100%}
.mcard .code{text-align:center;font-size:20px;letter-spacing:.24em;font-weight:700;font-variant-numeric:tabular-nums}
.mcard .gold{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 0}

/* ダッシュボード */
.feebig{display:flex;align-items:center;gap:14px}
.feebig .dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.feebig .dot svg{width:30px;height:30px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.feebig.ok .dot{background:var(--ok-bg)} .feebig.ok .dot svg{stroke:var(--ok)}
.feebig.warn .dot{background:var(--warn-bg)} .feebig.warn .dot svg{stroke:var(--warn)}
.feebig.mute .dot{background:var(--mute-bg)} .feebig.mute .dot svg{stroke:var(--sub)}
.feebig .big{font-size:22px;font-weight:700;line-height:1.2}
.years{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ntc{border-top:1px solid var(--line);padding:12px 0}
.ntc:first-child{border-top:0;padding-top:0}
.ntc button{all:unset;display:block;width:100%;cursor:pointer}
.ntc .d{font-size:12.5px;color:var(--sub)}
.ntc .ti{font-weight:700}
.ntc .bd{display:block;margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:15.5px}
.ntc.open .bd{display:block}

/* 天気・防災 */
.banner{border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.banner.ok{background:var(--ok-bg);color:#14583a} .banner.advisory{background:var(--warn-bg);color:#6e4100}
.banner.warning{background:#fbe0dc;color:#8d1d16} .banner.special{background:#5a1d6b;color:#fff}
.banner b{font-size:17px}
.wlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.wlist li{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.links{display:grid;gap:8px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:var(--ink);font-weight:600}
.links a::after{content:"›";font-size:22px;color:var(--sub)}
.today{display:flex;align-items:center;gap:16px}
.today svg.wi{width:84px;height:84px;flex:none}
.today .tx{font-size:20px;font-weight:700;line-height:1.35}
.tm{display:flex;gap:18px;margin-top:10px;font-weight:700}
.tm .lo{color:#2563a8} .tm .hi{color:var(--red)}
.pops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pops div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:13px}
.pops b{display:block;font-size:18px}
.wk{display:grid;grid-template-columns:5.6em 34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wk:first-of-type{border-top:0}
.wk svg{width:30px;height:30px}
.wk .tt{text-align:right;font-weight:700;white-space:nowrap}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,#ebe6da,#f5f1e8,#ebe6da);background-size:200% 100%;animation:sk 1.4s infinite linear;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:88vw;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:20;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 下のタブ(どの画面からでも、閉じずに移動できる) */
.bnav{overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:6;width:min(100%,520px);display:flex;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.bnav button{all:unset;position:relative;flex:0 0 auto;width:calc(100% / 5.5);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;border-radius:12px}
.bnav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current=page]{color:var(--navy);background:#eef2f9}
.bnav::-webkit-scrollbar{display:none}
.bnav button{scroll-snap-align:start}
.bnav button.off{color:var(--red)}
.bnav button.soon svg,.bnav button.soon span{opacity:.5}
.bnav button span{white-space:nowrap}
.bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#d92d20;color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700;border:2px solid #fffdf8;line-height:14px}
.tile .bdg{top:8px;left:8px}
.chpick{display:block;width:100%;text-align:left;padding:12px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:17px;color:inherit}.chpick[aria-pressed=true]{border-color:#1e3a5f;background:#eef3fb}.chpick:disabled{opacity:.55}
.bdg.g{background:#2e9e5b}.bdg.y{background:#e8a317;color:#3a2a00}.bdg.r{background:#d92d20}
.sch{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.sch .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sch .dt{font-weight:800;font-size:17px}
.sch .tt{font-size:16px;font-weight:700;margin:6px 0 0}.sch .pl{color:var(--sub);font-size:14px}
.lvc{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:800}.lvc.g{background:#e3f5ea;color:#1e7a45}.lvc.y{background:#fff1c9;color:#8a5a00}.lvc.r{background:#fde4e1;color:#b42318}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ans button{padding:11px 4px;border-radius:10px;border:1.5px solid #cfc8b8;background:#fff;font-size:15px;font-weight:700;color:var(--ink)}
.ans button.on.a0{background:#2e9e5b;color:#fff;border-color:#2e9e5b}.ans button.on.a1{background:#d92d20;color:#fff;border-color:#d92d20}.ans button.on.a2{background:#6b7280;color:#fff;border-color:#6b7280}
.sch .cn{font-size:13px;color:var(--sub);margin-top:8px}.sch details{margin-top:6px;font-size:14px}.sch summary{cursor:pointer;color:var(--navy);font-weight:700}.sch .nm{margin:4px 0}
.sch .note{margin-top:8px;padding:8px 10px;border-left:4px solid var(--gold);background:#fbf5e6;border-radius:6px;font-size:14px}.sch .note b{display:block}.sch .note .by{color:var(--sub);font-size:12px}.sch .note .nb{white-space:pre-wrap;word-break:break-word}.sch .note img{max-width:100%;border-radius:8px;margin-top:6px;display:block}.sch .note a.fl{display:inline-block;margin-top:6px;margin-right:8px;padding:6px 10px;border:1px solid var(--navy);border-radius:8px;color:var(--navy);font-weight:700;text-decoration:none;font-size:13px}.sch .nx{float:right;border:0;background:#eee;border-radius:6px;font-size:12px;padding:2px 8px}.sch .nform{margin-top:8px;padding:8px;border:1px dashed #cfc8b8;border-radius:8px}.sch .nform input[type=text],.sch .nform textarea{width:100%;margin-bottom:6px}
.pvrow{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 0}.pvrow .x{flex:none;border:0;background:#eee;border-radius:8px;padding:4px 10px;font-weight:700}
.bnav button:active{background:var(--mute-bg)}
body.hasnav #app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
/* 役員画面 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--navy);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{all:unset;text-align:center;padding:10px 4px;font-weight:700;color:var(--navy);cursor:pointer;min-height:24px;box-sizing:border-box;font-size:14px}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{all:unset;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.gh .hd{font-weight:700;font-size:17px}
.mrow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.mrow.first{border-top:0}
.mrow .nm{font-weight:700}
.mrow .ad{font-size:14px;color:var(--sub)}
.mrow.done .nm{opacity:.55}
.mrow .acts{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{all:unset;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--navy);color:var(--navy);font-weight:700;font-size:14.5px;cursor:pointer;box-sizing:border-box}
.sbtn.fill{background:var(--navy);color:#fff}
.sbtn.blue{background:#1b5fc4;border-color:#1b5fc4;color:#fff}
.sbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sbtn[disabled]{opacity:.5}
.bar{height:10px;background:#e3e8ef;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.mis{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.mi{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--mute-bg);color:var(--sub);border:0;font-family:inherit}
button.mi{cursor:pointer;min-height:32px}
.mi.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}.mi.ok{background:var(--ok-bg);color:var(--ok)}
.dot2{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-4px;margin-right:4px}
.dot2.on{background:var(--red)} .dot2.off{border:2px solid var(--line)}
.stable{width:100%;border-collapse:collapse;font-size:14.5px}.stable th,.stable td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}.stable th:first-child,.stable td:first-child{text-align:left}.stable th{font-size:12.5px;color:var(--sub);border-top:0}
.scanres{border-left:5px solid var(--navy)}
.scanres.good{border-left-color:var(--ok)} .scanres.warn{border-left-color:var(--warn)}
.inrow{display:flex;gap:8px}.inrow input{flex:1;min-width:0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:17px;letter-spacing:.1em;text-transform:uppercase;background:#fff}
/* チャット */
.ml{all:unset;display:block;box-sizing:border-box;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px 7px 26px;margin-bottom:5px;position:relative;cursor:pointer}
.ml:active{transform:scale(.99)}
.ml .dt{position:absolute;left:10px;top:14px;width:9px;height:9px;border-radius:50%;background:#d92d20}
.ml .sj{font-size:15px;line-height:1.35;display:flex;align-items:center;gap:5px;min-width:0}.ml .sx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ml .rc{font-size:12px;color:var(--sub);flex-shrink:0}.ml .at{flex-shrink:0}.at.imp{background:#fde3e3;color:#c0322b}
.ml.un .sj{font-weight:700}

/* ---------- カメラ読み取り(この画面のカメラ。LINEの読み取りが使えないとき・連続で読むとき) ---------- */
var CAM = null;
function camStop() { if (CAM) { CAM.stop(); CAM = null; } }
function camScan(o) {   // o: { onCode(code), host(要素。無ければ全画面), keep(true=読んだあとも続ける) }
  camStop();
  var host = o.host, ov = null;
  if (!host) { ov = document.createElement('div'); ov.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px'; document.body.appendChild(ov); host = ov; }
  host.innerHTML = '<video playsinline muted style="width:100%;max-width:520px;border-radius:14px;background:#000"></video><p class="cam-m" style="margin:10px 0;' + (ov ? 'color:#fff' : '') + '">QRを枠の中に映してください</p><div class="inrow"><button class="sbtn cam-x" type="button">' + (ov ? '閉じる' : 'カメラを止める') + '</button><label class="sbtn" style="cursor:pointer">写真から読む<input type="file" class="cam-f" accept="image/*" capture="environment" style="display:none"></label></div><canvas style="display:none"></canvas>';
  var video = $('video', host), cv = $('canvas', host), ctx = cv.getContext('2d', { willReadFrequently: true }), msg = $('.cam-m', host);
  var stream = null, raf = 0, alive = true, busy = false, last = '', lastAt = 0, det = null;
  function say(t) { msg.textContent = t; }
  function stop() { alive = false; cancelAnimationFrame(raf); if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } if (ov) ov.remove(); else host.innerHTML = ''; }
  CAM = { stop: stop };
  function got(code) {
    var now = Date.now(); if (code === last && now - lastAt < 3000) return; last = code; lastAt = now;
    if (navigator.vibrate) navigator.vibrate(80);
    if (!o.keep) { camStop(); }
    o.onCode(code);
  }
  function decodeCanvas() {
    if (!window.jsQR) { say('QRを読む部品を読み込めませんでした。通信状態を確認してください。'); return ''; }
    var f = window.jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'attemptBoth' });
    return f ? f.data : '';
  }
  function tick() {
    if (!alive) return;
    raf = requestAnimationFrame(tick);
    if (busy || video.readyState < 2 || !video.videoWidth) return;
    busy = true;
    var finish = function () { setTimeout(function () { busy = false; }, 250); };
    var fromCanvas = function () {
      var sc = Math.min(1, 720 / Math.max(video.videoWidth, video.videoHeight)); cv.width = Math.round(video.videoWidth * sc); cv.height = Math.round(video.videoHeight * sc);
      ctx.drawImage(video, 0, 0, cv.width, cv.height); var c = decodeCanvas(); if (c) got(c); finish();
    };
    if (det) det.detect(video).then(function (r) { if (r.length && r[0].rawValue) { got(r[0].rawValue); finish(); } else fromCanvas(); }).catch(function () { det = null; fromCanvas(); });
    else fromCanvas();
  }
  $('.cam-x', host).onclick = camStop;
  $('.cam-f', host).onchange = function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    createImageBitmap(f).then(function (bm) {
      var sc = Math.min(1, 1600 / Math.max(bm.width, bm.height)); cv.width = Math.round(bm.width * sc); cv.height = Math.round(bm.height * sc); ctx.drawImage(bm, 0, 0, cv.width, cv.height);
      var c = decodeCanvas(); if (c) got(c); else say('写真からQRを読めませんでした。QRを大きく写して、もう一度お試しください。');
    }).catch(function () { say('写真を開けませんでした。'); });
  };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('この画面ではカメラを使えません。「写真から読む」か、QRスキャナー(入力欄)をお使いください。'); return; }
  navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } }).then(function (st) {
    if (!alive) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
    stream = st; video.srcObject = st; return video.play();
  }).then(function () {
    if (!alive) return;
    if ('BarcodeDetector' in window) { try { det = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; } }
    say('カメラ起動中。QRを枠の中に映してください。'); raf = requestAnimationFrame(tick);
  }).catch(function (e) {
    say('カメラを起動できません(' + (e && e.name || 'エラー') + ')。スマホ/ブラウザの設定でカメラを「許可」にするか、「写真から読む」をお使いください。');
  });
}

var DK = { mode: 'matsuri', timer: 0, items: [], total: 0, done: 0, busy: false };

    if (!apps.length) return msg(who + ': 申込が見つかりません', true);
    if (!todo.length) return msg(who + ': すでに受取済みです(' + (apps[0].receivedAt || '') + ')', true);
    var chain = Promise.resolve();
    todo.forEach(function (a) { chain = chain.then(function () { return api('o_queue_add', { id: a.id }); }); });

      api('o_scan', { mode: DK.mode, code: v }).then(function (r) { $('#dcode').value = ''; queueApps((r.apps || []).filter(function (a) { return r.mode === 'matsuri' ? true : a.event === '演芸会' || true; }), (r.person.memberName || r.person.name) + ' 様'); })
        .catch(function (e) { msg(e.message, true); });
    } else {

      api('o_find', { event: DK.mode === 'engeikai' ? '演芸会' : '祭礼', q: v }).then(function (d) {

function shrinkImage(file, max) {
  return new Promise(function (ok, ng) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = function () { URL.revokeObjectURL(url); ng(new Error('画像を読み込めませんでした。')); };
    img.src = url;
  });
}

function phUrl(id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 800); }
function bodyHtml(b) {

  }).join('');

function cropSquare(file, size) {
  return new Promise(function (ok, ng) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var m = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); ng(new Error('写真を読み込めませんでした。')); };
    img.src = url;
  });
}

function noticeAdminView() {
  sub('お知らせの更新', '<div class="skel" style="height:240px"></div>', 'officer');
  api('a_notice_list').then(function (d) {
    NA.today = d.today; NA.list = d.notices;
    sub('お知らせの更新', '<button class="btn" id="nnew">＋ 新しいお知らせ</button><div style="height:12px"></div>' + (d.notices.length ? d.notices.map(function (n) {
      return '<button class="ml" data-id="' + esc(n.id) + '"><div class="sj">' + esc(n.title) + '</div><div class="mt">' + esc(n.from || '') + (n.to ? ' 〜 ' + esc(n.to) : ' 〜') + ' ・ ' + esc(n.audience) + '</div>' + (n.published ? '' : '<span class="tg warn">非公開</span>') + (n.to && n.to < d.today ? '<span class="tg">終了</span>' : '') + '</button>';
    }).join('') : '<div class="card"><p class="muted" style="margin:0">お知らせはまだありません。</p></div>') + '<p class="small" style="margin:8px 4px">ここで作ったお知らせは、会員のダッシュボード「町会からのお知らせ」に出ます(新しいものは赤バッジ)。</p>', 'officer');
    $('#nnew').onclick = function () { noticeEditView(null); };
    Array.prototype.forEach.call(document.querySelectorAll('.ml[data-id]'), function (b) { b.onclick = function () { noticeEditView(NA.list.filter(function (x) { return x.id === b.dataset.id; })[0]); }; });
  }).catch(function (e) { offErr('お知らせの更新', e, 'officer'); });
}
function noticeEditView(n) {
  n = n || { id: '', title: '', body: '', audience: 'すべて', from: NA.today, to: '', published: true };
  sub(n.id ? 'お知らせを直す' : '新しいお知らせ', '<div class="card"><div class="field"><label class="l" for="nt">タイトル<span class="req">必須</span></label><input class="inp" id="nt" maxlength="80" value="' + esc(n.title) + '"></div>' +
    '<div class="field"><label class="l" for="nb">本文<span class="req">必須</span></label><textarea class="inp" id="nb" maxlength="3000" style="min-height:160px">' + esc(n.body) + '</textarea></div>' +
    '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">見られる人</span><div class="chips" id="na">' + ['すべて', '役員以上'].map(function (a) { return '<button data-a="' + a + '" aria-pressed="' + (a === n.audience) + '">' + a + '</button>'; }).join('') + '</div></div>' +
    '<div class="field"><label class="l" for="nf">公開開始(2026-10-26 の形)</label><input class="inp" id="nf" maxlength="10" value="' + esc(n.from) + '"></div>' +
    '<div class="field"><label class="l" for="ne">公開終了(空なら、ずっと)</label><input class="inp" id="ne" maxlength="10" value="' + esc(n.to) + '"></div>' +
    '<div class="field"><span class="l" style="display:block;font-weight:700;margin-bottom:6px">公開</span><div class="chips" id="np">' + [['公開する', true], ['非公開(下書き)', false]].map(function (a) { return '<button data-p="' + a[1] + '" aria-pressed="' + (a[1] === n.published) + '">' + a[0] + '</button>'; }).join('') + '</div></div>' +
    '<button class="btn" id="nsv">保存する</button>' + (n.id ? '<div style="height:10px"></div><button class="btn ghost" id="ndl">このお知らせを削除する</button>' : '') + '</div>', 'a_notice');
  var aud = n.audience, pub = n.published;
  function chips(id, set) { Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) { b.onclick = function () { set(b); Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }; }); }
  chips('na', function (b) { aud = b.dataset.a; }); chips('np', function (b) { pub = b.dataset.p === 'true'; });
  $('#nsv').onclick = function () { var b = $('#nsv'); b.disabled = true; api('a_notice_save', { id: n.id, title: $('#nt').value, body: $('#nb').value, audience: aud, from: $('#nf').value, to: $('#ne').value, published: pub }).then(function () { toast('保存しました'); go('a_notice'); noticeAdminView(); }).catch(function (e) { b.disabled = false; toast(e.message); }); };
  if (n.id) $('#ndl').onclick = function () { askChoice('このお知らせを削除します', ['削除する'], '元に戻せません。').then(function (v) { if (!v) return; api('a_notice_delete', { id: n.id }).then(function () { toast('削除しました'); go('a_notice'); noticeAdminView(); }).catch(function (e) { toast(e.message); }); }); };
}

/* ---------- ルーティング ---------- */
function loadMe() { return api('me').then(function (me) { S.me = me; return me; }); }
function route() {
  var me = S.me; if (!me) return;
  if (me.state !== 'approved') return me.state === 'none' ? formView(null, false) : statusView();
  var full = (location.hash || '').replace('#', ''), h = full.split('/')[0];
  var officerOnly = /^(officer|o_sum|o_unpaid|o_circ|o_chg|o_roster|o_scan|o_scanrun|o_search|o_desk|o_sched|o_docs|o_doc)$/.test(h);
  if ((officerOnly && !isOfficer()) || (/^(a_img|a_disaster|a_docs|a_notice|a_event|a_sched)$/.test(h) && !isAdmin())) h = '';
  renderNav(h);
  var seg = full.split('/')[1];
  if (h === 'mail' && seg) return mailDetailView(seg);
  if (h === 'board' && seg) return boardDetailView(seg);
  if (h === 'bosaiedit' && seg) return bosaiEditView(seg);
  if (h === 'bosai') return bosaiView();
  if (h === 'profile') return profileView();
  if (h === 'evguardian') return evGuardianView();
  if (h === 'evapply' && seg) return evApplyView(decodeURIComponent(seg));
  if (h === 'evperson' && seg) return evPersonView(seg);
  if (h === 'evreg' && seg) return evRegView(decodeURIComponent(seg));
  if (h === 'o_docs' && seg) return docsView(decodeURIComponent(seg));
  ({ o_sched: schedView, a_sched: schedAdminView, o_desk: deskView, o_scanrun: scanView, o_search: searchView, card: cardView, dash: dashView, suginami: suginamiView, weather: weatherView, mail: mailView, mailnew: mailNewView, icon: iconView, event: eventView, tips: tipsView, board: boardView, boardnew: boardNewView, help: helpView, helpnew: helpNewView, mystery: mysteryView, a_img: imgAdminView, a_disaster: disasterView, a_docs: docsAdminView, a_notice: noticeAdminView, a_event: eventAdminView, officer: officerView, headchg: headchgView, o_sum: sumView, o_unpaid: unpaidView, o_circ: circView, o_chg: chgView, o_roster: rosterView, o_scan: qrHubView }[h] || homeView)();
}
window.addEventListener('hashchange', route);

function boot() {
  var p;
  if (CFG.ALLOW_PREVIEW && /[?&]preview=/.test(location.search)) {
    var s = document.createElement('script'); s.src = 'preview.js';
    p = new Promise(function (ok, ng) { s.onload = ok; s.onerror = function () { ng(new Error('preview.js がありません')); }; document.head.appendChild(s); });
  } else {
    if (!window.liff) return fatal(new Error('LINEの機能を読み込めませんでした。通信状況をご確認ください。'));
    if (!CFG.LIFF_ID || !CFG.API_URL) return fatal(new Error('設定(config.js)が未完了です。'));
    p = liff.init({ liffId: CFG.LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return new Promise(function () {}); }
    });
  }
  p.then(startMe).catch(fatal);
}

/* ---------- 起動を速くする: 前回の画面を先に出し、最新は裏で取る ---------- */
var ME_KEY = 'hmt_me_';
function meSub() { try { var t = window.liff && !window.__previewApi && liff.getDecodedIDToken(); return t && t.sub || ''; } catch (e) { return ''; } }
function saveMe(me) {
  try {
    var sub = meSub(); if (!sub || !me || me.state !== 'approved') return;
    var c = JSON.parse(JSON.stringify(me)); c.profile = { lineName: me.profile && me.profile.lineName };   // 住所などは保存しない
    localStorage.setItem(ME_KEY + sub, JSON.stringify(c));
  } catch (e) { /* 保存できなくても動く */ }
}
function cachedMe() {
  try { var sub = meSub(); if (!sub) return null; var c = JSON.parse(localStorage.getItem(ME_KEY + sub) || 'null'); return c && c.state === 'approved' && c.menu && c.profile ? c : null; } catch (e) { return null; }
}
function curHash() { return (location.hash || '').replace('#', '').split('/')[0]; }
function startMe() {
  var cached = cachedMe();
  if (cached) { S.me = cached; route(); }
  var bp = api('badges').catch(function () { return null; });
  return api('me', { nobadge: true }).catch(function (e) { if (cached && e && e.code === 'network') { toast(e.message); return null; } throw e; }).then(function (me) {
    if (!me) return bp;
    if (S.me && S.me.badges) me.badges = S.me.badges;   // 新しいバッジが届くまで、前の値のまま
    var same = cached && cached.state === me.state && JSON.stringify([cached.role, cached.menu, cached.disaster, cached.drill, cached.disasterKind]) === JSON.stringify([me.role, me.menu, me.disaster, me.drill, me.disasterKind]);
    S.me = me;
    if (!same) route();
    saveMe(me);
    return bp;
  }).then(function (b) {
    if (!b || !S.me || S.me.state !== 'approved') return;
    if (curHash() === 'dash') b.dashboard = 0;
    var before = JSON.stringify(S.me.badges || {}); S.me.badges = b; saveMe(S.me);
    if (JSON.stringify(b) === before) return;
    var h = curHash();
    if ((h === '' || h === 'home') && window.scrollY < 40) homeView();
    renderNav(h);
  });
}
boot();
})();
</script>
</body>
